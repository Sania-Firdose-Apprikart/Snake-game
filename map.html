<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .header {
      width: 100%;
      height: 50px;
      background-color: #0400ff;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Comic Sans MS", cursive;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 2px solid #ff00c8;
    }
    .main-container {
      width: 100%;
      height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sub-container {
      width: 90%;
      height: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: white;
      border: 1px solid black;
    }
    .map-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    .map-container img {
      position: absolute;

      cursor: pointer; /* Optional: makes it clear it's movable/clickable */
    }
    .map-container img:nth-child(1) {
      width: 20%;
      top: 5%;
      left: 35%;
    }
    .map-container img:nth-child(2) {
      width: 10%;
      top: 8.8%;
      left: 34.5%;
    }
    .map-container img:nth-child(3) {
      width: 10%;
      top: 13%;
      left: 43.5%;
    }
  </style>
  <body>
    <header class="header">Map Game</header>
    <div class="main-container">
      <div class="sub-container">
        <div class="map-container">
          <img src="/images/map-images/Ladakh.svg" alt="" />
          <img src="/images/map-images/Jammu_and_Kashmir.svg" alt="" />
          <img src="/images/map-images/Himachal_Pradesh.svg" alt="" />
          <img src="/images/map-images/Punjab.svg " alt="" />
          <img src="/images/map-images/Uttarkhand.svg" alt="" />
        </div>
      </div>
    </div>
  </body>
</html>
