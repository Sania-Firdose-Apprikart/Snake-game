<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Jungle Safari Run 🦁</title>
<style>
  :root{
    --bg:#cfe9d8;
    --panel:#fafffa;
    --accent:#2e7d32;
    --dark-accent: #1b5e20;
  }
  html,body{height:100%;margin:0;font-family:Inter, system-ui, sans-serif;background:linear-gradient(180deg,#bfe7c8, #86c07a);display:flex;align-items:center;justify-content:center;}
  #gameWrap{width:100%;max-width:1100px;height:640px;display:grid;grid-template-columns:1fr 320px;gap:16px;padding:16px;box-sizing:border-box;}
  #left{background:linear-gradient(#8ad39e,#57a86a);border-radius:12px;position:relative;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,0.2);}
  canvas{display:block;width:100%;height:100%;}
  #right{background:var(--panel);border-radius:12px;padding:20px;box-shadow:0 6px 18px rgba(0,0,0,0.12);display:flex;flex-direction:column;gap:16px}
  h2{margin:0;font-size:20px;color:var(--accent)}
  .panelRow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .treasureList{background:#f0f8f1;border-radius:8px;padding:10px;height:240px;overflow:auto;border:1px dashed #d8f0df}
  .treasureItem{display:flex;gap:10px;align-items:center;padding:8px;border-radius:6px;background:#fff;border:1px solid #e8f5e9; margin-bottom:6px;}
  .treasureIcon{width:36px;height:36px;flex:0 0 36px;background:linear-gradient(180deg,#ffd36a,#ffb14a);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:bold}
  .scoreBig{font-size:28px;font-weight:700;color:var(--dark-accent); text-shadow: 1px 1px 0 #a5d6a7;}
  .btn{background:linear-gradient(180deg,#4caf50,#2e7d32);color:white;padding:12px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:600; transition: transform 0.1s ease;}
  .btn:hover{transform: scale(1.05);}
  .btn:active{transform: scale(0.98);}
  .small{font-size:13px;color:#3b7a3a}
  .muted{color:#6b8a6b;font-size:13px}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .popup{background:rgba(255,255,255,0.98);padding:24px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.35);text-align:center;max-width:360px}
  .hide{display:none}
  .shine{animation:shine 900ms linear infinite}
  @keyframes shine{0%{transform:translateY(0);}50%{transform:translateY(-6px);}100%{transform:translateY(0)}}
  footer{margin-top:auto;font-size:12px;color:#4a7a4a}
  @media (max-width:900px){
    #gameWrap{grid-template-columns:1fr;max-width:420px;height:720px}
    #right{order:2}
  }
</style>
</head>
<body>
  <div id="gameWrap" role="application" aria-label="Jungle Safari Run game">
    <div id="left">
      <canvas id="gameCanvas" width="1024" height="640"></canvas>
      <div id="overlay"></div>
    </div>
    <div id="right">
      <div class="panelRow">
        <h2>Jungle Safari Run</h2>
        <div class="small muted">Tap/click the boy to jump</div>
      </div>

      <div class="panelRow">
        <div>
          <div class="muted">Score (distance)</div>
          <div id="score" class="scoreBig">0</div>
        </div>
        <div>
          <div class="muted">High Score</div>
          <div id="highScore" class="small">0</div>
        </div>
      </div>

      <div>
        <div class="muted">Speed</div>
        <div id="speed" class="muted">1.0x</div>
      </div>

      <div>
        <div class="muted">Treasure Chest Collection</div>
        <div class="treasureList" id="treasureList">
          <!-- collected treasures -->
        </div>
      </div>

      <div class="panelRow">
        <button id="playBtn" class="btn">Play / Restart</button>
        <div>
          <div class="muted">Coins</div>
          <div id="coins" style="font-weight:700">0</div>
        </div>
      </div>

      <footer>Cartoonish art | Click/tap to jump | Inspired by endless runners</footer>
    </div>
  </div>

<script>

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('score');
const highEl = document.getElementById('highScore');
const coinsEl = document.getElementById('coins');
const speedEl = document.getElementById('speed');
const treasureList = document.getElementById('treasureList');
const playBtn = document.getElementById('playBtn');

let W = canvas.width, H = canvas.height;

function fitCanvas() {
  const rect = canvas.getBoundingClientRect();
}
fitCanvas();

window.addEventListener('resize', fitCanvas);

// Game state
let running = false;
let lastTime = 0;
let spawnTimer = 0;
let spawnInterval = 1400; // ms initial
let obstacles = [];
let pickups = [];
let parallax = [];
let score = 0;
let speed = 1;
let coins = 0;
let highScore = Number(localStorage.getItem('jungle_high') || 0);
let treasures = {}; // map id -> count

highEl.textContent = highScore;

// Utility
function rand(min, max){ return Math.random()*(max-min)+min; }
function choose(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// Player
const player = {
  x: 160, y: H - 140, w: 58, h: 84,
  vy:0, gravity:0.9, jumpForce:-22, onGround:true, // Jump force increased
  alive:true,
};

function resetGame(){
  obstacles = [];
  pickups = [];
  parallax = [];
  spawnTimer = 0;
  score = 0;
  speed = 1;
  coins = 0;
  player.y = H - 140;
  player.vy = 0;
  player.onGround = true;
  player.alive = true;
  overlay.innerHTML = '';
  treasures = {};
  updateTreasureUI();
  updateHUD();
}

// Parallax tree blocks
for(let i=0;i<8;i++){
  parallax.push({
    x: i*300,
    y: rand(H-320, H-220),
    size: rand(80,130),
    speedMul: rand(0.2,0.6)
  });
}

// Obstacles types: fallenTree, quicksand, animal, pond
function spawnObstacle(){
  const t = Math.random();
  let type;
  if(t < 0.25) type = 'fallenTree';
  else if(t < 0.50) type = 'quicksand';
  else if(t < 0.70) type = 'animal';
  else if(t < 0.85) type = 'pond';
  else type = 'stones'; // New obstacle

  const obj = {type, x: W + 80, passed:false};
  if(type==='fallenTree'){
    obj.w = 120; obj.h = 60; obj.y = H - 130;
    obj.rot = rand(-0.1,0.1);
  } else if(type==='quicksand'){
    obj.w = 160; obj.h = 34; obj.y = H - 110;
    obj.slow = 0.45;
  } else if(type==='animal'){
    obj.w = 86; obj.h = 66; obj.y = H - 146;
    obj.kind = choose(['lion', 'tiger', 'snake']); // Updated kinds
  } else if(type==='pond'){
    obj.w = 240; obj.h = 36; obj.y = H - 96;
  } else if(type==='stones'){
    obj.w = 70; obj.h = 70; obj.y = H - 140;
    obj.count = choose([2,3]);
  }
  obstacles.push(obj);

  if (Math.random() < 0.7 && (obj.type === 'fallenTree' || obj.type === 'stones')) {
    for (let i = 0; i < 5; i++) {
        pickups.push({
            kind: 'coin',
            x: obj.x + i * 30,
            y: H - 260 - Math.sin(i / 4 * Math.PI) * 80,
            w: 32, h: 32,
        });
    }
  } else if (Math.random() < 0.4) {
    pickups.push({
        kind: Math.random() < 0.1 ? 'treasure' : 'coin',
        x: W + 80 + rand(20, 100),
        y: H - 220 - rand(0, 40),
        w: 32, h: 32,
        shine: Math.random() < 0.5,
    });
  }
}

// Collision
function rectsCollide(a,b){
  return a.x < b.x + b.w &&
         a.x + a.w > b.x &&
         a.y < b.y + b.h &&
         a.y + a.h > b.y;
}

// HUD update
function updateHUD(){
  scoreEl.textContent = Math.floor(score);
  coinsEl.textContent = coins;
  speedEl.textContent = speed.toFixed(2) + 'x';
  highEl.textContent = highScore;
}

// Treasure UI
function addTreasure(type){
  treasures[type] = (treasures[type]||0)+1;
  updateTreasureUI();
}
function updateTreasureUI(){
  treasureList.innerHTML = '';
  if(Object.keys(treasures).length===0){
    treasureList.innerHTML = '<div class="muted" style="padding:10px;">No treasures collected yet</div>';
    return;
  }
  Object.entries(treasures).forEach(([k,v])=>{
    const div = document.createElement('div');
    div.className = 'treasureItem';
    div.innerHTML = `
      <div class="treasureIcon">${k.slice(0,1).toUpperCase()}</div>
      <div>
        <div style="font-weight:700">${k.replace(/_/g,' ')}</div>
        <div class="muted" style="font-size:13px">${v} collected</div>
      </div>
    `;
    treasureList.appendChild(div);
  });
}

// Draw functions
function drawBackground(dt){
  const bgGrad = ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0, '#6ab083');
  bgGrad.addColorStop(1, '#8ad39e');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,W,H);

  parallax.forEach(p => {
    p.x -= 160 * p.speedMul * dt * speed;
    if(p.x < -p.size * 2) p.x += parallax.length * 300;

    const trunkWidth = p.size * 0.15;
    const trunkHeight = p.size;
    const canopyRadius = p.size * 0.6;

    ctx.fillStyle = '#5D4037';
    ctx.fillRect(p.x, p.y, trunkWidth, trunkHeight);

    ctx.fillStyle = '#1B5E20';
    ctx.beginPath();
    ctx.arc(p.x + trunkWidth / 2, p.y, canopyRadius, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#2E7D32';
    ctx.beginPath();
    ctx.arc(p.x + trunkWidth / 2 + 10, p.y - 20, canopyRadius * 0.8, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#4CAF50';
    ctx.beginPath();
    ctx.arc(p.x + trunkWidth / 2 - 10, p.y - 15, canopyRadius * 0.7, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.fillStyle = '#4a8c49';
  ctx.fillRect(0, H - 90, W, 90);
  ctx.fillStyle = '#3c6f3b';
  ctx.fillRect(0, H - 90, W, 14);
}

function drawPlayer(){
  const p = player;
  ctx.save();
  const shadowY = H - 48;
  const shadowX = p.x + p.w / 2;
  ctx.beginPath();
  ctx.ellipse(shadowX, shadowY, p.w * 0.4, 8, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fill();

  const frame = Math.floor(performance.now() / 150) % 2;

  const skinTone = '#E0A370';
  const hairColor = '#3D2314';
  const shortsColor = '#D2B48C';
  const spotColor = '#654321';

  const legY = p.y + p.h * 0.5;
  ctx.fillStyle = skinTone;
  if (frame === 0) {
    roundRect(ctx, p.x + 15, legY, 12, 38, 5, true, false);
    roundRect(ctx, p.x + 30, legY - 5, 12, 42, 5, true, false);
  } else {
    roundRect(ctx, p.x + 15, legY - 5, 12, 42, 5, true, false);
    roundRect(ctx, p.x + 30, legY, 12, 38, 5, true, false);
  }

  ctx.fillStyle = skinTone;
  roundRect(ctx, p.x + 10, p.y + 10, p.w - 20, p.h * 0.5, 8, true, false);

  ctx.fillStyle = shortsColor;
  ctx.fillRect(p.x + 10, p.y + p.h * 0.5, p.w - 20, 20);
  ctx.fillStyle = spotColor;
  for(let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.arc(p.x + 15 + Math.random() * (p.w - 30), p.y + p.h * 0.5 + 5 + Math.random() * 10, 2.5, 0, Math.PI * 2);
      ctx.fill();
  }

  ctx.fillStyle = skinTone;
  ctx.beginPath();
  ctx.arc(p.x + p.w / 2, p.y, 18, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = hairColor;
  ctx.beginPath();
  ctx.moveTo(p.x + 10, p.y - 5);
  ctx.quadraticCurveTo(p.x + p.w / 2, p.y - 30, p.x + p.w - 10, p.y - 5);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(p.x + p.w / 2 + 5, p.y, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'black';
  ctx.beginPath();
  ctx.arc(p.x + p.w / 2 + 6, p.y, 2, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = skinTone;
  const armX = frame === 0 ? p.x + 5 : p.x + p.w - 15;
  roundRect(ctx, armX, p.y + 20, 10, 30, 5, true, false);

  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r, fill, stroke){
  if (w < 2 * r) r = w / 2;
  if (h < 2 * r) r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}

function drawObstacles(dt){
  obstacles.forEach(o=>{
    if(o.type==='fallenTree'){
      ctx.fillStyle = '#6B4F2E';
      ctx.beginPath();
      ctx.moveTo(o.x, o.y + 5);
      ctx.quadraticCurveTo(o.x + o.w / 2, o.y - 10, o.x + o.w, o.y + 5);
      ctx.quadraticCurveTo(o.x + o.w + 10, o.y + o.h / 2, o.x + o.w, o.y + o.h - 5);
      ctx.quadraticCurveTo(o.x + o.w / 2, o.y + o.h + 10, o.x, o.y + o.h - 5);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#2E7D32';
      for(let i=0; i<3; i++) {
          ctx.beginPath();
          ctx.arc(o.x + rand(10, o.w-10), o.y + rand(10, o.h-10), rand(10, 20), 0, Math.PI * 2);
          ctx.fill();
      }
    } else if(o.type==='stones'){
      ctx.fillStyle = '#888';
      roundRect(ctx, o.x, o.y, o.w, o.h, 20, true, false);
      ctx.fillStyle = '#666';
      roundRect(ctx, o.x + 30, o.y - 20, o.w - 30, o.h - 20, 15, true, false);
    } else if(o.type==='quicksand'){
      ctx.fillStyle = '#d6a46a';
      ctx.beginPath();
      ctx.ellipse(o.x + o.w/2, o.y + o.h/2 + 10, o.w/2, o.h, 0, 0, Math.PI*2);
      ctx.fill();
    } else if(o.type==='animal'){
      if (o.kind === 'lion') {
        ctx.fillStyle = '#D4A24E';
        roundRect(ctx, o.x, o.y, o.w, o.h, 15, true, false);
        ctx.fillStyle = '#A0522D';
        ctx.beginPath();
        ctx.arc(o.x + o.w/2, o.y + o.h/2 - 10, 40, 0, Math.PI * 2);
        ctx.fill();
      } else if (o.kind === 'tiger') {
        ctx.fillStyle = '#F0A500';
        roundRect(ctx, o.x, o.y, o.w, o.h, 15, true, false);
        ctx.fillStyle = '#000';
        for(let i=0; i<4; i++) {
            ctx.fillRect(o.x + 10 + i*20, o.y, 8, o.h);
        }
      } else if (o.kind === 'snake') {
        ctx.fillStyle = '#3A9943';
        ctx.beginPath();
        ctx.ellipse(o.x + o.w/2, o.y + o.h - 10, o.w/2, 10, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.ellipse(o.x + o.w/2 - 15, o.y + o.h - 25, o.w/2.5, 8, 0.3, 0, Math.PI*2);
        ctx.fill();
        ctx.ellipse(o.x + o.w/2 + 10, o.y + o.h - 40, o.w/3, 6, -0.2, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#52D05E';
        ctx.beginPath();
        ctx.arc(o.x + o.w/2 + 25, o.y + o.h - 50, 10, 0, Math.PI*2);
        ctx.fill();
      }
    } else if(o.type==='pond'){
      const g = ctx.createLinearGradient(o.x, o.y, o.x, o.y + o.h+10);
      g.addColorStop(0,'#58c0d6'); g.addColorStop(1,'#2a9bbb');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(o.x + o.w/2, o.y + o.h/2 + 6, o.w/2, o.h*0.9, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      for(let i=0; i<3; i++) {
        const fishX = o.x + 15 + (i * o.w / 3) + Math.sin(performance.now()/500 + i) * 10;
        const fishY = o.y + o.h/2 + Math.cos(performance.now()/500 + i) * 5;
        ctx.beginPath();
        ctx.ellipse(fishX, fishY, 10, 5, Math.PI / 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  });
}

function drawPickups(dt){
  pickups.forEach(p=>{
    if(p.kind==='coin'){
      const time = performance.now();
      const scaleX = Math.abs(Math.sin(time / 200 + p.x / 100));
      const width = p.w * scaleX;
      const x = p.x + (p.w - width) / 2;

      ctx.fillStyle = '#FFD700'; // Gold
      ctx.beginPath();
      ctx.ellipse(x + width / 2, p.y + p.h / 2, width / 2, p.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#DAA520'; // GoldenRod
      ctx.beginPath();
      ctx.ellipse(x + width / 2, p.y + p.h / 2 + 1, width / 2, p.h / 2, 0, 0, Math.PI);
      ctx.fill();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.beginPath();
      ctx.arc(x + width / 2, p.y + p.h / 2, width / 4, -0.5, Math.PI * 1.5);
      ctx.fill();

    } else if(p.kind==='treasure'){
      ctx.fillStyle = '#8d4a1f';
      roundRect(ctx, p.x, p.y, p.w, p.h, 6, true, false);
      ctx.fillStyle = '#ffd36a';
      ctx.fillRect(p.x+6, p.y+6, p.w-12, 8);
      if(p.shine){
        ctx.beginPath();
        ctx.fillStyle = 'rgba(255,255,255,0.65)';
        ctx.ellipse(p.x + p.w/2, p.y - 6 + Math.sin(performance.now()/200)*3, 8, 6, 0, 0, Math.PI*2);
        ctx.fill();
      }
    }
  });
}

function showGameOver(){
  player.alive = false;
  running = false;
  if(Math.floor(score) > highScore){
    highScore = Math.floor(score);
    localStorage.setItem('jungle_high', highScore);
  }
  updateHUD();

  overlay.innerHTML = '';
  overlay.style.pointerEvents = 'auto';
  const div = document.createElement('div');
  div.className = 'popup';
  div.innerHTML = `
    <div style="font-size:22px;font-weight:800;color:#c62828">Game Over</div>
    <div style="margin-top:8px">You ran <strong>${Math.floor(score)}</strong> meters</div>
    <div style="margin:8px 0">Coins: <strong>${coins}</strong></div>
    <div style="margin-bottom:8px">High Score: <strong>${highScore}</strong></div>
    <div style="margin-top:12px"><button id="againBtn" class="btn">Play Again</button></div>
    <div style="margin-top:10px;color:#6b8a6b;font-size:13px">The boy tripped or got caught — try again!</div>
  `;
  overlay.appendChild(div);

  document.getElementById('againBtn').addEventListener('click', ()=>{
    overlay.innerHTML = '';
    overlay.style.pointerEvents = 'none';
    startGame();
  });

  let fallY = player.y;
  let fallVel = 6;
  const fallInterval = setInterval(()=>{
    fallY += fallVel;
    fallVel += 1.8;
    div.style.transform = `translateY(${Math.min(140, fallVel*4)}px)`;
  }, 60);
  setTimeout(()=>clearInterval(fallInterval), 900);
}

// Input
function doJump(){
  if(!player.alive || !running) return;
  if(player.onGround){
    player.vy = player.jumpForce;
    player.onGround = false;
  }
}
canvas.addEventListener('click', doJump);
canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); doJump(); }, {passive:false});
document.addEventListener('keydown', (e)=>{ if(e.code==='Space' || e.key==='ArrowUp') doJump(); });

// Main loop
function gameLoop(ts){
  if(!lastTime) lastTime = ts;
  const dt = Math.min(60, ts - lastTime) / 1000; // seconds
  lastTime = ts;

  if(running){
    speed += 0.0009;
    spawnInterval = Math.max(650, 1400 - (speed-1)*200);

    spawnTimer += dt*1000;
    if(spawnTimer > spawnInterval){
      spawnTimer = 0;
      spawnObstacle();
    }

    player.vy += player.gravity;
    player.y += player.vy;
    if(player.y >= H - 140){
      player.y = H - 140;
      player.vy = 0;
      player.onGround = true;
    }

    let moveBy = 320 * dt * speed;
    obstacles.forEach(o=>{
      o.x -= moveBy;
      if(!o.passed && o.x + o.w < player.x){
        o.passed = true;
      }
    });
    obstacles = obstacles.filter(o => o.x + o.w > -200);

    pickups.forEach(p => p.x -= moveBy);
    pickups = pickups.filter(p => p.x + p.w > -100);

    obstacles.forEach(o=>{
      const pobj = {x:player.x+10,y:player.y+8,w:player.w-22,h:player.h-12};
      if(rectsCollide(pobj, o)){
        if(o.type === 'quicksand'){
          speed = Math.max(0.65, speed - 0.22);
        } else if(o.type === 'fallenTree' || o.type === 'pond' || o.type==='animal'){
          player.alive = false;
          running = false;
          setTimeout(showGameOver, 250);
        }
      }
    });

    pickups.forEach((p, idx)=>{
      const pobj = {x:player.x+10,y:player.y+8,w:player.w-22,h:player.h-12};
      if(rectsCollide(pobj, p)){
        if(p.kind === 'coin'){
          coins++;
        } else if(p.kind === 'treasure'){
          const name = choose(['gold_statue','emerald_figure','ancient_coin','pearl_necklace']);
          addTreasure(name);
        }
        p.collected = true;
      }
    });
    pickups = pickups.filter(p => !p.collected);

    score += 42 * dt * speed;
    updateHUD();
  }

  ctx.fillStyle = '#86c07a';
  ctx.fillRect(0,0,W,H);
  drawBackground(dt);

  ctx.fillStyle = '#6ea660';
  ctx.fillRect(0, H - 90, W, 20);

  drawPickups(dt);
  drawObstacles(dt);

  drawPlayer();

  if(!running && player.alive){
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.font = '20px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Click / Tap the boy to jump — Press Play to start', W/2, 60);
  }

  requestAnimationFrame(gameLoop);
}

function startGame(){
  resetGame();
  running = true;
  lastTime = 0;
}
playBtn.addEventListener('click', ()=>{
  if(!running && player.alive) startGame();
  else if (!player.alive) { /* handled by popup */ }
  else { // restart mid-game
    resetGame();
    running = true;
  }
});

(function showIntro(){
  overlay.innerHTML = '';
  overlay.style.pointerEvents = 'auto';
  const div = document.createElement('div');
  div.className = 'popup';
  div.innerHTML = `
    <div style="font-size:20px;font-weight:900;color:#2e7d32">Jungle Safari Run</div>
    <div style="margin:8px 0;color:#5a8e66">Help the jungle boy rescue animals and collect treasures.</div>
    <div style="text-align:left;margin-top:8px">
      <div>• Click / tap the boy to jump.</div>
      <div>• Avoid fallen trees, ponds and wild animals.</div>
      <div>• Collect coins and treasure boxes.</div>
    </div>
    <div style="margin-top:12px"><button id="startNow" class="btn">Start Game</button></div>
  `;
  overlay.appendChild(div);
  document.getElementById('startNow').addEventListener('click', ()=>{
    overlay.innerHTML = '';
    overlay.style.pointerEvents = 'none';
    startGame();
  });
})();

requestAnimationFrame(gameLoop);

</script>
</body>
</html>
