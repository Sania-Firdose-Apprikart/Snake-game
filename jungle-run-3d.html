<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jungle Run 3D</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Carter+One&family=Poppins:wght@400;600&display=swap');
      
      :root {
        --font-title: 'Carter One', cursive;
        --font-body: 'Poppins', sans-serif;
        --color-wood: #8B5A2B;
        --color-wood-dark: #5C3A1A;
        --color-leaves: #228B22;
        --color-text: #FFFFFF;
        --color-gold: #FFD700;
        --color-danger: #FF4500;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        font-family: var(--font-body);
        background: #87CEEB; /* Fallback sky color */
      }

      #ui-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
        color: var(--color-text);
      }

      /* Score & Speed - Wooden Sign Style */
      .ui-panel {
        position: absolute;
        top: 20px;
        background: linear-gradient(145deg, var(--color-wood), var(--color-wood-dark));
        border-radius: 15px;
        padding: 10px 25px;
        border: 5px solid var(--color-wood-dark);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4), inset 0 0 15px rgba(0,0,0,0.3);
        text-align: center;
      }

      #score-container {
        left: 20px;
      }

      #speed-container {
        right: 20px;
      }

      .ui-panel .label {
        font-family: var(--font-title);
        font-size: 16px;
        color: rgba(255, 255, 255, 0.8);
        letter-spacing: 1px;
        text-shadow: 1px 1px 2px var(--color-wood-dark);
      }

      .ui-panel .value {
        font-family: var(--font-title);
        font-size: 32px;
        text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
      }
      
      #score {
        color: var(--color-gold);
      }

      #speed {
        color: var(--color-danger);
      }

      /* Controls Guide - Stone Tablet Style */
      #controls {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(8px);
        border-radius: 20px;
        padding: 15px 30px;
        display: flex;
        gap: 25px;
        border: 2px solid rgba(255,255,255,0.1);
      }

      .control-item {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .key {
        background: linear-gradient(145deg, #888, #555);
        color: white;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        font-weight: 600;
        font-size: 18px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5), inset 0 -2px 2px rgba(0,0,0,0.3);
      }

      .control-item span {
        font-size: 14px;
        font-weight: 600;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
      }

      /* Modal Screens (Start/Game Over) */
      .modal-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        pointer-events: auto;
        z-index: 100;
        text-shadow: 0 5px 15px rgba(0,0,0,0.5);
      }

      #start-screen {
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.8), rgba(118, 75, 162, 0.8)), url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path d="M15 5 L35 5 L25 25 Z M65 5 L85 5 L75 25 Z M15 45 L35 45 L25 65 Z M65 45 L85 45 L75 65 Z" fill="rgba(255,255,255,0.05)" /></svg>');
        backdrop-filter: blur(5px);
      }
      
      #game-over-screen {
        display: none; /* Initially hidden */
        background: linear-gradient(135deg, rgba(40, 0, 0, 0.8), rgba(80, 20, 20, 0.8));
        backdrop-filter: blur(15px);
        animation: fadeIn 0.5s ease;
      }

      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

      .modal-screen h1 {
        font-family: var(--font-title);
        font-size: clamp(3rem, 12vw, 7rem);
        margin-bottom: 10px;
        animation: float 3s ease-in-out infinite;
      }

      #game-over-screen h1 {
        background: linear-gradient(135deg, #ff6b6b, #ff4444);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: pulse 2s infinite;
      }

      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
      @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

      .modal-screen p {
        font-size: clamp(1rem, 4vw, 1.5rem);
        margin-bottom: 40px;
        opacity: 0.9;
      }

      #final-score {
        font-size: 1.8rem;
        margin: 20px 0;
        background: rgba(0, 0, 0, 0.2);
        padding: 20px 40px;
        border-radius: 15px;
        border: 2px solid rgba(255, 215, 0, 0.3);
      }

      #final-score span {
        color: var(--color-gold);
        font-weight: 800;
        font-size: 2.5rem;
      }

      .modal-button {
        font-family: var(--font-title);
        font-size: clamp(1.2rem, 5vw, 2rem);
        padding: 20px 50px;
        border: none;
        color: white;
        cursor: pointer;
        border-radius: 50px;
        text-transform: uppercase;
        letter-spacing: 2px;
        transition: all 0.3s ease;
      }

      #start-button {
        background: linear-gradient(135deg, #4CAF50, #2E8B57);
        box-shadow: 0 10px 30px rgba(46, 139, 87, 0.5);
      }
      #start-button:hover {
        transform: scale(1.1);
        box-shadow: 0 15px 40px rgba(46, 139, 87, 0.7);
      }

      #restart-button {
        background: linear-gradient(135deg, #FFD700, #FFA500);
        color: var(--color-wood-dark);
        box-shadow: 0 10px 30px rgba(255, 215, 0, 0.5);
        margin-top: 20px;
      }
      #restart-button:hover {
        transform: translateY(-5px) scale(1.05);
        box-shadow: 0 15px 40px rgba(255, 215, 0, 0.6);
      }

    </style>
  </head>
  <body>
    <div id="ui-container">
      <!-- Start Screen -->
      <div id="start-screen" class="modal-screen">
        <h1>🌴 JUNGLE RUN 3D 🌴</h1>
        <p>Escape through the wild jungle!</p>
        <button id="start-button" class="modal-button">START ADVENTURE</button>
      </div>

      <!-- Score Display -->
      <div id="score-container" class="ui-panel">
        <div class="label">Fruits</div>
        <div id="score" class="value">0</div>
      </div>

      <!-- Speed Meter -->
      <div id="speed-container" class="ui-panel">
        <div class="label">Speed</div>
        <div id="speed" class="value">1.0x</div>
      </div>

      <!-- Controls Guide -->
      <div id="controls">
        <div class="control-item">
          <div class="key">←</div>
          <span>Left</span>
        </div>
        <div class="control-item">
          <div class="key">→</div>
          <span>Right</span>
        </div>
        <div class="control-item">
          <div class="key">↑</div>
          <span>Jump</span>
        </div>
        <div class="control-item">
          <div class="key">↓</div>
          <span>Slide</span>
        </div>
      </div>

      <!-- Game Over Screen -->
      <div id="game-over-screen" class="modal-screen">
        <h1>GAME OVER</h1>
        <div id="final-score">
          You collected <span id="final-score-number">0</span> fruits!
        </div>
        <button id="restart-button" class="modal-button">Play Again</button>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      // ======== SCENE SETUP ========
      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x87CEEB, 20, 100);
      
      const camera = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x87CEEB);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      // ======== LIGHTING ========
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);
      
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(10, 20, 10);
      dirLight.castShadow = true;
      dirLight.shadow.camera.left = -20;
      dirLight.shadow.camera.right = 20;
      dirLight.shadow.camera.top = 20;
      dirLight.shadow.camera.bottom = -20;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      scene.add(dirLight);

      const fillLight = new THREE.DirectionalLight(0x9090ff, 0.3);
      fillLight.position.set(-10, 10, -10);
      scene.add(fillLight);

      // ======== UI ELEMENTS ========
      const scoreEl = document.getElementById('score');
      const speedEl = document.getElementById('speed');
      const gameOverScreen = document.getElementById('game-over-screen');
      const finalScoreNum = document.getElementById('final-score-number');
      const restartBtn = document.getElementById('restart-button');
      const startScreen = document.getElementById('start-screen');
      const startBtn = document.getElementById('start-button');

      // ======== GAME STATE ========
      let player, playerBox;
      let gameSpeed, score, gameOver, gameStarted;
      let activeTiles = [];
      let activeObstacles = [];
      let activeCoins = [];
      const lanes = [-2.5, 0, 2.5];
      let currentLane;
      let isJumping, isSliding, verticalVelocity;
      const gravity = -0.025;

      // ======== PLAYER ========
      function createPlayer() {
        const playerGroup = new THREE.Group();
        const skinMat = new THREE.MeshStandardMaterial({ 
          color: '#D2956F',
          roughness: 0.6,
          metalness: 0.05
        });

        // Body
        const bodyGeo = new THREE.SphereGeometry(0.45, 16, 16);
        const body = new THREE.Mesh(bodyGeo, skinMat);
        body.scale.set(1, 1.3, 0.8);
        body.position.y = 1.2;
        body.castShadow = true;
        playerGroup.add(body);

        // Head
        const headGeo = new THREE.SphereGeometry(0.4, 20, 20);
        const head = new THREE.Mesh(headGeo, skinMat);
        head.scale.set(1, 1.1, 0.95);
        head.position.y = 2.1;
        head.castShadow = true;
        playerGroup.add(head);

        // Hair
        const hairMat = new THREE.MeshStandardMaterial({ 
          color: '#3D2817',
          roughness: 0.9
        });
        for (let i = 0; i < 12; i++) {
          const angle = (i / 12) * Math.PI * 2;
          const hairStrand = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), hairMat);
          hairStrand.scale.set(0.8, 1.4, 0.6);
          const radius = 0.32;
          hairStrand.position.set(Math.cos(angle) * radius, 2.45 + Math.random() * 0.15, Math.sin(angle) * radius);
          hairStrand.rotation.set(Math.random() * 0.3, angle, Math.random() * 0.4 + 0.2);
          hairStrand.castShadow = true;
          playerGroup.add(hairStrand);
        }

        // Face features (Eyes, Brows, Nose, Mouth) - kept as is
        const eyeMat = new THREE.MeshStandardMaterial({ color: '#FFFFFF' });
        const irisMat = new THREE.MeshStandardMaterial({ color: '#3D2817' });
        const pupilMat = new THREE.MeshStandardMaterial({ color: '#000000' });
        const leftEyeWhite = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 12), eyeMat);
        leftEyeWhite.position.set(-0.15, 2.15, 0.32); leftEyeWhite.scale.set(1.2, 1, 0.5); playerGroup.add(leftEyeWhite);
        const leftIris = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 12), irisMat);
        leftIris.position.set(-0.15, 2.15, 0.37); playerGroup.add(leftIris);
        const leftPupil = new THREE.Mesh(new THREE.SphereGeometry(0.025, 8, 8), pupilMat);
        leftPupil.position.set(-0.15, 2.15, 0.39); playerGroup.add(leftPupil);
        const rightEyeWhite = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 12), eyeMat);
        rightEyeWhite.position.set(0.15, 2.15, 0.32); rightEyeWhite.scale.set(1.2, 1, 0.5); playerGroup.add(rightEyeWhite);
        const rightIris = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 12), irisMat);
        rightIris.position.set(0.15, 2.15, 0.37); playerGroup.add(rightIris);
        const rightPupil = new THREE.Mesh(new THREE.SphereGeometry(0.025, 8, 8), pupilMat);
        rightPupil.position.set(0.15, 2.15, 0.39); playerGroup.add(rightPupil);
        const browMat = new THREE.MeshStandardMaterial({ color: '#3D2817' });
        const leftBrow = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.03, 0.02), browMat);
        leftBrow.position.set(-0.15, 2.28, 0.35); leftBrow.rotation.z = 0.1; playerGroup.add(leftBrow);
        const rightBrow = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.03, 0.02), browMat);
        rightBrow.position.set(0.15, 2.28, 0.35); rightBrow.rotation.z = -0.1; playerGroup.add(rightBrow);
        const nose = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 12), skinMat);
        nose.scale.set(0.7, 0.8, 1.2); nose.position.set(0, 2.05, 0.38); playerGroup.add(nose);
        const mouthMat = new THREE.MeshStandardMaterial({ color: '#8B4513' });
        const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.02, 8, 12, Math.PI), mouthMat);
        mouth.position.set(0, 1.92, 0.35); mouth.rotation.x = Math.PI; playerGroup.add(mouth);

        // Arms
        const armGeo = new THREE.CylinderGeometry(0.12, 0.1, 0.8, 12);
        const leftArm = new THREE.Mesh(armGeo, skinMat);
        leftArm.name = 'leftArm';
        leftArm.position.set(-0.55, 1.1, 0);
        leftArm.rotation.z = 0.3;
        leftArm.castShadow = true;
        playerGroup.add(leftArm);
        const rightArm = new THREE.Mesh(armGeo, skinMat);
        rightArm.name = 'rightArm';
        rightArm.position.set(0.55, 1.1, 0);
        rightArm.rotation.z = -0.3;
        rightArm.castShadow = true;
        playerGroup.add(rightArm);

        // Hands - Redesigned
        const handGeo = new THREE.BoxGeometry(0.2, 0.25, 0.1);
        const leftHand = new THREE.Mesh(handGeo, skinMat);
        leftHand.position.y = -0.4;
        leftArm.add(leftHand);
        const rightHand = new THREE.Mesh(handGeo, skinMat);
        rightHand.position.y = -0.4;
        rightArm.add(rightHand);

        // Legs
        const legGeo = new THREE.CylinderGeometry(0.14, 0.12, 0.9, 12);
        const leftLeg = new THREE.Mesh(legGeo, skinMat);
        leftLeg.name = 'leftLeg';
        leftLeg.position.set(-0.18, 0.35, 0);
        leftLeg.castShadow = true;
        playerGroup.add(leftLeg);
        const rightLeg = new THREE.Mesh(legGeo, skinMat);
        rightLeg.name = 'rightLeg';
        rightLeg.position.set(0.18, 0.35, 0);
        rightLeg.castShadow = true;
        playerGroup.add(rightLeg);

        // Feet
        const footGeo = new THREE.SphereGeometry(0.14, 12, 12);
        const leftFoot = new THREE.Mesh(footGeo, skinMat);
        leftFoot.scale.set(0.8, 0.6, 1.3);
        leftFoot.position.set(0, -0.45, 0.08);
        leftLeg.add(leftFoot);
        const rightFoot = new THREE.Mesh(footGeo, skinMat);
        rightFoot.scale.set(0.8, 0.6, 1.3);
        rightFoot.position.set(0, -0.45, 0.08);
        rightLeg.add(rightFoot);

        // Leaf skirt & other details - kept as is
        const leafMat = new THREE.MeshStandardMaterial({ color: '#228B22', roughness: 0.7, side: THREE.DoubleSide });
        for (let i = 0; i < 12; i++) {
          const angle = (i / 12) * Math.PI * 2;
          const leafShape = new THREE.Shape();
          leafShape.moveTo(0, 0); leafShape.quadraticCurveTo(0.1, 0.15, 0, 0.4); leafShape.quadraticCurveTo(-0.1, 0.15, 0, 0);
          const leafGeo = new THREE.ExtrudeGeometry(leafShape, { depth: 0.02, bevelEnabled: false });
          const leaf = new THREE.Mesh(leafGeo, leafMat);
          leaf.position.set(Math.cos(angle) * 0.35, 0.75, Math.sin(angle) * 0.35);
          leaf.rotation.y = angle + Math.PI / 2; leaf.rotation.z = -0.3; leaf.castShadow = true;
          playerGroup.add(leaf);
        }
        for (let i = 0; i < 8; i++) {
          const angle = (i / 8) * Math.PI * 2;
          const leafBit = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.06, 0.02), leafMat);
          leafBit.position.set(Math.cos(angle) * 0.38, 1.65, Math.sin(angle) * 0.32);
          leafBit.rotation.y = angle;
          playerGroup.add(leafBit);
        }
        const pouchMat = new THREE.MeshStandardMaterial({ color: '#8B4513', roughness: 0.9 });
        const pouch = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 12), pouchMat);
        pouch.scale.set(1, 0.8, 0.6); pouch.position.set(0.35, 0.85, -0.2); pouch.castShadow = true; playerGroup.add(pouch);
        const strap = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.8, 8), pouchMat);
        strap.position.set(0.25, 1.3, 0); strap.rotation.z = -0.5; playerGroup.add(strap);

        playerGroup.position.y = 0.5;
        return playerGroup;
      }

      // ======== PATH & ENVIRONMENT ========
      function createTile(zPos) {
        const tile = new THREE.Group();
        
        // Realistic ground with texture-like appearance
        const groundMat = new THREE.MeshStandardMaterial({ 
          color: 0x3A5F0B,
          roughness: 0.95,
          metalness: 0.0
        });
        const groundGeo = new THREE.PlaneGeometry(10, 40);
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        tile.add(ground);

        // Dirt path in center
        const pathMat = new THREE.MeshStandardMaterial({ 
          color: 0x654321,
          roughness: 1
        });
        const path = new THREE.Mesh(new THREE.PlaneGeometry(7, 40), pathMat);
        path.rotation.x = -Math.PI / 2;
        path.position.y = 0.01;
        path.receiveShadow = true;
        tile.add(path);

        // Realistic jungle walls with foliage
        const wallMat = new THREE.MeshStandardMaterial({ 
          color: 0x1a4d2e,
          roughness: 1
        });
        const wallGeo = new THREE.BoxGeometry(1.5, 7, 40);
        
        const leftWall = new THREE.Mesh(wallGeo, wallMat);
        leftWall.position.set(-5.5, 3.5, 0);
        leftWall.castShadow = true;
        tile.add(leftWall);
        
        const rightWall = new THREE.Mesh(wallGeo, wallMat);
        rightWall.position.set(5.5, 3.5, 0);
        rightWall.castShadow = true;
        tile.add(rightWall);

        // Add dense foliage to walls
        for (let i = 0; i < 8; i++) {
          const zOffset = (Math.random() - 0.5) * 35;
          const yOffset = Math.random() * 5 + 1;
          
          // Left wall foliage
          const leftBush = createBush();
          leftBush.position.set(-5 + Math.random() * 0.5, yOffset, zOffset);
          tile.add(leftBush);
          
          // Right wall foliage
          const rightBush = createBush();
          rightBush.position.set(5 - Math.random() * 0.5, yOffset, zOffset);
          tile.add(rightBush);
        }

        // Ground vegetation
        for (let i = 0; i < 15; i++) {
          const xPos = (Math.random() - 0.5) * 9;
          const zPos = (Math.random() - 0.5) * 38;
          
          if (Math.abs(xPos) > 3) { // Keep path clear
            const grass = createGrassTuft();
            grass.position.set(xPos, 0, zPos);
            tile.add(grass);
          }
        }

        // Random flowers
        for (let i = 0; i < 8; i++) {
          const xPos = (Math.random() - 0.5) * 9;
          const zPos = (Math.random() - 0.5) * 38;
          
          if (Math.abs(xPos) > 3) {
            const flower = createFlower();
            flower.position.set(xPos, 0, zPos);
            tile.add(flower);
          }
        }

        // Rocks on path
        for (let i = 0; i < 5; i++) {
          const rock = createRock();
          rock.position.set(
            (Math.random() - 0.5) * 8,
            0,
            (Math.random() - 0.5) * 38
          );
          tile.add(rock);
        }

        tile.position.z = zPos;
        scene.add(tile);
        activeTiles.push(tile);
        return tile;
      }

      function createBush() {
        const bush = new THREE.Group();
        const leafMat = new THREE.MeshStandardMaterial({ 
          color: 0x2d5016,
          roughness: 0.9
        });
        
        for (let i = 0; i < 8; i++) {
          const leaf = new THREE.Mesh(
            new THREE.SphereGeometry(0.3 + Math.random() * 0.2, 8, 8),
            leafMat
          );
          leaf.position.set(
            (Math.random() - 0.5) * 0.6,
            (Math.random() - 0.5) * 0.6,
            (Math.random() - 0.5) * 0.6
          );
          leaf.castShadow = true;
          bush.add(leaf);
        }
        
        return bush;
      }

      function createGrassTuft() {
        const grass = new THREE.Group();
        const grassMat = new THREE.MeshStandardMaterial({ 
          color: 0x4a7c2e,
          side: THREE.DoubleSide
        });
        
        for (let i = 0; i < 5; i++) {
          const blade = new THREE.Mesh(
            new THREE.BoxGeometry(0.02, 0.4, 0.01),
            grassMat
          );
          blade.position.x = (Math.random() - 0.5) * 0.2;
          blade.position.z = (Math.random() - 0.5) * 0.2;
          blade.rotation.z = (Math.random() - 0.5) * 0.3;
          blade.rotation.y = Math.random() * Math.PI * 2;
          grass.add(blade);
        }
        
        return grass;
      }

      function createFlower() {
        const flower = new THREE.Group();
        
        // Stem
        const stemMat = new THREE.MeshStandardMaterial({ color: 0x2d5016 });
        const stem = new THREE.Mesh(
          new THREE.CylinderGeometry(0.02, 0.02, 0.3, 6),
          stemMat
        );
        stem.position.y = 0.15;
        flower.add(stem);
        
        // Petals
        const petalColors = [0xFF69B4, 0xFFFF00, 0xFF6347, 0x9370DB];
        const petalMat = new THREE.MeshStandardMaterial({ 
          color: petalColors[Math.floor(Math.random() * petalColors.length)]
        });
        
        for (let i = 0; i < 6; i++) {
          const petal = new THREE.Mesh(
            new THREE.SphereGeometry(0.08, 8, 8),
            petalMat
          );
          const angle = (i / 6) * Math.PI * 2;
          petal.position.set(
            Math.cos(angle) * 0.12,
            0.35,
            Math.sin(angle) * 0.12
          );
          petal.scale.set(0.7, 0.5, 0.3);
          flower.add(petal);
        }
        
        // Center
        const centerMat = new THREE.MeshStandardMaterial({ color: 0xFFD700 });
        const center = new THREE.Mesh(
          new THREE.SphereGeometry(0.06, 8, 8),
          centerMat
        );
        center.position.y = 0.35;
        flower.add(center);
        
        return flower;
      }

      function createRock() {
        const rockMat = new THREE.MeshStandardMaterial({ 
          color: 0x696969,
          roughness: 0.95
        });
        const rock = new THREE.Mesh(
          new THREE.SphereGeometry(0.15 + Math.random() * 0.1, 8, 8),
          rockMat
        );
        rock.scale.set(1, 0.6, 1.2);
        rock.castShadow = true;
        rock.receiveShadow = true;
        return rock;
      }

      // ======== OBSTACLES & COINS ========
      function spawnObstacle(tile) {
        const lane = Math.floor(Math.random() * 3);
        const obstacleType = choose(['fallenTree', 'pond', 'snake', 'lion', 'elephant']);
        let obstacle;

        switch (obstacleType) {
          case 'fallenTree':
            obstacle = createFallenTree();
            obstacle.userData.type = 'jump';
            break;
          case 'pond':
            obstacle = createPond();
            obstacle.userData.type = 'jump';
            break;
          case 'snake':
            obstacle = createSnake();
            obstacle.userData.type = 'jump';
            break;
          case 'lion':
            obstacle = createLion();
            obstacle.userData.type = 'dodge';
            break;
          case 'elephant':
            obstacle = createElephant();
            obstacle.userData.type = 'dodge';
            break;
        }

        obstacle.position.x = lanes[lane];
        obstacle.position.z = tile.position.z - 10;
        scene.add(obstacle);
        activeObstacles.push(obstacle);
      }

      function createFallenTree() {
        const logGeo = new THREE.CylinderGeometry(0.5, 0.5, 4, 8);
        const logMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
        const log = new THREE.Mesh(logGeo, logMat);
        log.rotation.z = Math.PI / 2;
        log.position.y = 0.5;
        log.castShadow = true;
        return log;
      }

      function createPond() {
        const pondGeo = new THREE.CylinderGeometry(1.5, 1.5, 0.1, 16);
        const pondMat = new THREE.MeshStandardMaterial({
          color: 0x1E90FF,
          transparent: true,
          opacity: 0.7,
          roughness: 0.2,
          metalness: 0.3
        });
        const pond = new THREE.Mesh(pondGeo, pondMat);
        pond.position.y = 0.05;
        return pond;
      }

      function createSnake() {
        const snake = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3A9943 });
        const segmentGeo = new THREE.SphereGeometry(0.3, 8, 8);
        for (let i = 0; i < 5; i++) {
          const segment = new THREE.Mesh(segmentGeo, bodyMat);
          segment.position.set(Math.sin(i) * 0.5, 0.3, i * 0.5 - 1);
          segment.castShadow = true;
          snake.add(segment);
        }
        return snake;
      }

      function createLion() {
        const lion = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({ color: '#D4A24E' });
        const maneMat = new THREE.MeshStandardMaterial({ color: '#A0522D' });
        
        const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 2), bodyMat);
        body.castShadow = true;
        
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), bodyMat);
        head.castShadow = true;
        
        const mane = new THREE.Mesh(new THREE.SphereGeometry(0.9, 16, 16), maneMat);
        mane.castShadow = true;
        
        head.position.z = -1.2;
        mane.position.z = -1.2;
        lion.add(body, head, mane);
        lion.position.y = 0.8;
        return lion;
      }

      function createElephant() {
        const elephant = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({ color: '#9E9E9E' });
        
        const body = new THREE.Mesh(new THREE.BoxGeometry(2, 2.5, 3), bodyMat);
        body.castShadow = true;
        
        const head = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16), bodyMat);
        head.castShadow = true;
        
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.1, 1.5, 8), bodyMat);
        trunk.castShadow = true;
        
        head.position.set(0, 0.5, -1.8);
        trunk.position.set(0, -0.5, -2.5);
        elephant.add(body, head, trunk);
        elephant.position.y = 1.25;
        return elephant;
      }

      function spawnCoins(tile) {
        const lane = Math.floor(Math.random() * 3);
        for (let i = 0; i < 5; i++) {
          const coin = createCoin();
          coin.position.set(lanes[lane], 1.5, tile.position.z - i * 3);
          scene.add(coin);
          activeCoins.push(coin);
        }
      }

      function createCoin() {
        const coinGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.1, 16);
        const coinMat = new THREE.MeshStandardMaterial({ 
          color: 0xFFD700,
          metalness: 0.8,
          roughness: 0.2,
          emissive: 0xFFD700,
          emissiveIntensity: 0.3
        });
        const coin = new THREE.Mesh(coinGeo, coinMat);
        coin.rotation.x = Math.PI / 2;
        coin.castShadow = true;
        return coin;
      }

      // ======== GAME LOGIC & LOOP ========
      function init() {
        score = 0;
        gameSpeed = 0.2;
        gameOver = false;
        gameStarted = false;
        currentLane = 1;
        isJumping = false;
        isSliding = false;
        verticalVelocity = 0;
        crouchAmount = 0;

        if (player) scene.remove(player);
        [...activeTiles, ...activeObstacles, ...activeCoins].forEach(obj => scene.remove(obj));
        activeTiles = [];
        activeObstacles = [];
        activeCoins = [];

        player = createPlayer();
        player.position.x = lanes[currentLane];
        scene.add(player);
        playerBox = new THREE.Box3();

        for (let i = 0; i < 12; i++) {
          const tile = createTile(i * -40);
          if (i > 2 && Math.random() < 0.5) spawnObstacle(tile);
          if (i > 1 && Math.random() < 0.4) spawnCoins(tile);
        }

        scoreEl.textContent = '0';
        speedEl.textContent = '1.0x';
        gameOverScreen.style.display = 'none';

        // New closer, higher camera angle
        camera.position.set(0, 8, 8);
        camera.lookAt(0, 1.5, -5);
      }

      function animate() {
        if (!gameStarted) {
          requestAnimationFrame(animate);
          renderer.render(scene, camera);
          activeCoins.forEach(coin => { coin.rotation.y += 0.05; });
          return;
        }
        
        requestAnimationFrame(animate);

        if(gameOver) {
            renderer.render(scene, camera);
            return;
        }

        const speed = gameSpeed;
        gameSpeed += 0.00005;

        speedEl.textContent = (gameSpeed / 0.2).toFixed(1) + 'x';

        player.position.z -= speed;

        // Smooth lane transition
        player.position.x += (lanes[currentLane] - player.position.x) * 0.15;

        // Jump physics
        if (isJumping) {
          player.position.y += verticalVelocity;
          verticalVelocity += gravity;
          if (player.position.y <= 0.5) {
            player.position.y = 0.5;
            isJumping = false;
            verticalVelocity = 0;
          }
        }

        // Crouch/Slide animation
        const crouchTarget = isSliding ? 1 : 0;
        crouchAmount += (crouchTarget - crouchAmount) * 0.2;
        player.children[0].position.y = 1.2 - crouchAmount * 0.4; // Body
        player.children[1].position.y = 2.1 - crouchAmount * 0.6; // Head

        // Running Animation
        const runCycle = performance.now() * 0.015;
        player.getObjectByName('leftArm').rotation.x = Math.sin(runCycle) * 0.6;
        player.getObjectByName('rightArm').rotation.x = -Math.sin(runCycle) * 0.6;
        player.getObjectByName('leftLeg').rotation.x = -Math.sin(runCycle) * 0.6;
        player.getObjectByName('rightLeg').rotation.x = Math.sin(runCycle) * 0.6;

        // Smooth camera follow
        camera.position.x += (player.position.x - camera.position.x) * 0.1;
        camera.position.z = player.position.z + 8; // Closer camera
        camera.lookAt(player.position.x, player.position.y + 1.5, player.position.z);

        playerBox.setFromObject(player);

        // Tile management
        if (activeTiles.length > 0 && player.position.z < activeTiles[0].position.z + 20) {
          scene.remove(activeTiles.shift());
          const newTile = createTile(activeTiles[activeTiles.length - 1].position.z - 40);
          if (Math.random() < 0.6) spawnObstacle(newTile);
          if (Math.random() < 0.5) spawnCoins(newTile);
        }

        // Collision detection
        activeObstacles.forEach((obstacle, index) => {
          const obstacleBox = new THREE.Box3().setFromObject(obstacle);
          if (playerBox.intersectsBox(obstacleBox)) {
            let collision = true;
            if (obstacle.userData.type === 'jump' && player.position.y > 1.2) {
                collision = false;
            }
            if (obstacle.userData.type === 'slide' && isSliding) {
                collision = false;
            }
            if(collision) endGame();
          }
          if (obstacle.position.z > camera.position.z + 10) {
            scene.remove(obstacle);
            activeObstacles.splice(index, 1);
          }
        });

        activeCoins.forEach((coin, index) => {
          coin.rotation.y += 0.1;
          const coinBox = new THREE.Box3().setFromObject(coin);
          if (playerBox.intersectsBox(coinBox)) {
            score++;
            scoreEl.textContent = score;
            scene.remove(coin);
            activeCoins.splice(index, 1);
          }
          if (coin.position.z > camera.position.z + 10) {
            scene.remove(coin);
            activeCoins.splice(index, 1);
          }
        });

        renderer.render(scene, camera);
      }

      function endGame() {
        gameOver = true;
        finalScoreNum.textContent = score;
        gameOverScreen.style.display = 'flex';
      }

      function startGame() {
        startScreen.style.display = 'none';
        gameStarted = true;
      }

      function restartGame() {
        init();
        gameStarted = true;
      }

      // ======== CONTROLS ========
      function handleKeyDown(event) {
        if (!gameStarted || gameOver) return;
        
        switch (event.key) {
          case 'ArrowLeft':
            if (currentLane > 0) {
              currentLane--;
              // Smooth lane transition handled by camera
            }
            break;
          case 'ArrowRight':
            if (currentLane < lanes.length - 1) {
              currentLane++;
            }
            break;
          case 'ArrowUp':
            if (!isJumping) {
              isJumping = true;
              verticalVelocity = 0.6;
            }
            break;
          case 'ArrowDown':
            if (!isSliding) {
              isSliding = true;
              setTimeout(() => { isSliding = false; }, 800);
            }
            break;
        }
        
        // Smooth player position update
        player.position.x += (lanes[currentLane] - player.position.x) * 0.2;
      }

      // ======== EVENT LISTENERS ========
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
      
      document.addEventListener('keydown', handleKeyDown);
      restartBtn.addEventListener('click', restartGame);
      startBtn.addEventListener('click', startGame);

      // ======== UTILITY ========
      function choose(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      // ======== START GAME ========
      init();
      animate();
    </script>
  </body>
</html>
