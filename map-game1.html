<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>India Map Game</title>
    <style>
      body {
        font-family: "Comic Sans MS", cursive;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #f0f0f0;
        margin: 0;
        padding: 0;
      }
      .header {
        width: 100%;
        overflow-x: auto;
        white-space: nowrap;
        background-color: #ffcc00;
        padding: 10px;
        border-bottom: 2px solid #ff6600;
      }
      .state-button {
        display: inline-block;
        margin: 5px;
        padding: 10px 20px;
        background-color: #ff6600;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: move;
        font-size: 16px;
        transition: transform 0.2s;
      }
      .state-button:hover {
        transform: scale(1.1);
      }
      .game-container {
        width: 80%;
        min-height: 500px;
        background-color: white;
        border: 2px dashed #ff6600;
        margin: 20px 0;
        position: relative;
        overflow: hidden;
      }
      .state-piece {
        position: absolute;
        cursor: move;
        transition: transform 0.2s;
      }
      .state-piece:hover {
        transform: scale(1.1);
      }
      #restart-btn {
        padding: 10px 20px;
        background-color: #ff6600;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
      }
      #restart-btn:hover {
        background-color: #cc5200;
      }
      #score {
        margin-top: 20px;
        font-size: 20px;
        display: none;
      }
      .flag {
        width: 100px;
        height: auto;
      }
      @media (max-width: 600px) {
        .game-container {
          width: 95%;
        }
      }
    </style>
  </head>
  <body>
    <div class="header" id="state-buttons">
      <!-- State buttons will be dynamically added here -->
    </div>

    <div
      class="game-container"
      id="game-container"
      ondrop="drop(event)"
      ondragover="allowDrop(event)"
    ></div>
    <button id="restart-btn" onclick="restartGame()">Play Again</button>
    <div id="score"></div>

    <script>
      const states = [
        "Andhra Pradesh",
        "Arunachal Pradesh",
        "Assam",
        "Bihar",
        "Chhattisgarh",
        "Gujarat",
        "Haryana",
        "Himachal Pradesh",
        "Jammu and Kashmir",
        "Jharkhand",
        "Karnataka",
        "Kerala",
        "Ladakh",
        "Madhya Pradesh",
        "Maharashtra",
        "Manipur",
        "Meghalaya",
        "Mizoram",
        "Nagaland",
        "Odisha",
        "Punjab",
        "Rajasthan",
        "Sikkim",
        "Tamil Nadu",
        "Telangana",
        "Tripura",
        "Uttar Pradesh",
        "Uttarakhand",
        "West Bengal",
        "Andaman and Nicobar",
        "Chandigarh",
      ];

      let draggedState = null;
      let placedStates = new Set();

      // Dynamically add state buttons
      const header = document.getElementById("state-buttons");
      states.forEach((state) => {
        const button = document.createElement("button");
        button.className = "state-button";
        button.textContent = state;
        button.draggable = true;
        button.ondragstart = (e) => drag(e, state);
        header.appendChild(button);
      });

      function allowDrop(event) {
        event.preventDefault();
      }

      function drag(event, state) {
        draggedState = state;
        event.dataTransfer.setData("text", state);
      }

      function drop(event) {
        event.preventDefault();
        const state = event.dataTransfer.getData("text");
        if (!placedStates.has(state)) {
          const svg = document.createElement("img");
          svg.src = `/images/map-images/${state}`;
          svg.className = "state-piece";
          svg.draggable = true;
          svg.ondragstart = (e) => drag(e, state);
          svg.style.left = event.clientX - 50 + "px";
          svg.style.top = event.clientY - 50 + "px";
          document.getElementById("game-container").appendChild(svg);
          placedStates.add(state);
        }
      }

      function restartGame() {
        placedStates.clear();
        document.getElementById("game-container").innerHTML = "";
        document.getElementById("score").style.display = "none";
        const buttons = document.getElementsByClassName("state-button");
        for (let button of buttons) {
          button.style.display = "inline-block";
        }
      }

      function checkWin() {
        if (placedStates.size === states.length) {
          const scoreDiv = document.getElementById("score");
          scoreDiv.innerHTML = `<img src="https://upload.wikimedia.org/wikipedia/en/thumb/4/41/Flag_of_India.svg/1200px-Flag_of_India.svg.png" class="flag"> Final Score: ${states.length}/${states.length}`;
          scoreDiv.style.display = "block";
          const buttons = document.getElementsByClassName("state-button");
          for (let button of buttons) {
            button.style.display = "none";
          }
        }
      }

      document
        .getElementById("game-container")
        .addEventListener("dragover", allowDrop);
      document
        .getElementById("game-container")
        .addEventListener("drop", (e) => {
          drop(e);
          checkWin();
        });
    </script>
  </body>
</html>
