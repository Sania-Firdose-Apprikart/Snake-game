<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Candy Dash — Prototype</title>
  <style>
    /* Basic reset + canvas sizing */
    html,body { height:100%; margin:0; font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif; background: #fef2f7; }
    #game-container { position:relative; width:100%; max-width:900px; margin:0 auto; }
    canvas { display:block; width:100%; background: linear-gradient(#ffeef6,#fff); border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.15);}
    /* HUD */
    .hud { position:absolute; left:0; right:0; top:10px; display:flex; justify-content:space-between; padding:0 12px; pointer-events:none; }
    .hud .left, .hud .center, .hud .right { pointer-events:auto; }
    button { font-size:16px; padding:8px 12px; border-radius:8px; }
    /* Simple overlays */
    .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.45); color:white; font-size:22px; }
    .hidden { display:none; }
  </style>
</head>
<body>
<div id="game-container">
  <!-- Game Canvas -->
  <canvas id="game" width="900" height="500"></canvas>

  <!-- HUD -->
  <div class="hud">
    <div class="left">
      <div id="score">Score: 0</div>
      <div id="candies">Candies: 0</div>
    </div>
    <div class="center">
      <button id="playBtn">Play</button>
      <button id="pauseBtn">Pause</button>
    </div>
    <div class="right">
      <button id="muteBtn">🔊</button>
    </div>
  </div>

  <!-- Start / Game Over Overlays -->
  <div id="startOverlay" class="overlay">
    <div>
      <h1>Candy Dash 🍭</h1>
      <p>Swipe to change lanes. Swipe up to jump. Swipe down to slide.</p>
      <button id="startPlay">Start Game</button>
    </div>
  </div>

  <div id="gameOverOverlay" class="overlay hidden">
    <div>
      <h2>Game Over</h2>
      <div id="finalScore">Score: 0</div>
      <button id="retryBtn">Retry</button>
    </div>
  </div>
</div>

<!-- Audio placeholders (can be loaded via JS) -->
<audio id="music" loop src="assets/music_loop.mp3"></audio>
<audio id="sfx_collect" src="assets/sfx_collect_candy.wav"></audio>
<audio id="sfx_jump" src="assets/sfx_jump.wav"></audio>

<script>
(function() {
  // Constants (tweakable)
  const CANVAS = document.getElementById('game');
  const ctx = CANVAS.getContext('2d');
  const BASE_SPEED = 300; // px/sec
  const GRAVITY = 1200;
  const JUMP_FORCE = -520;
  const LANE_Y = [360, 300, 240]; // example y positions for lanes

  // HUD
  const scoreEl = document.getElementById('score');
  const candiesEl = document.getElementById('candies');
  const startOverlay = document.getElementById('startOverlay');
  const gameOverOverlay = document.getElementById('gameOverOverlay');

  // Game state
  let state = 'menu'; // 'menu'|'playing'|'paused'|'gameover'
  let lastTime = 0;
  let distance = 0;
  let player = {
    x: 150, lane:1, y: LANE_Y[1], vy:0, width:64, height:64, grounded:true, jumping:false, sliding:false
  };

  // Input (very simple - expand for swipe)
  window.addEventListener('keydown', (e)=> {
    if (state !== 'playing') return;
    if (e.key === 'ArrowUp' || e.key === 'w') jump();
    if (e.key === 'ArrowDown' || e.key === 's') slide();
    if (e.key === 'ArrowLeft') changeLane(-1);
    if (e.key === 'ArrowRight') changeLane(1);
  });

  document.getElementById('startPlay').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);
  document.getElementById('pauseBtn').addEventListener('click', ()=> {
    state = (state === 'playing') ? 'paused' : 'playing';
    if(state==='playing') requestAnimationFrame(loop);
  });

  function startGame() {
    state = 'playing';
    startOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');
    distance = 0;
    lastTime = performance.now();
    player.lane = 1; player.y = LANE_Y[1]; player.vy = 0; player.grounded=true;
    requestAnimationFrame(loop);
  }

  function endGame() {
    state = 'gameover';
    document.getElementById('finalScore').textContent = 'Score: ' + Math.floor(distance);
    gameOverOverlay.classList.remove('hidden');
  }

  function jump() {
    if (!player.grounded) return;
    player.vy = JUMP_FORCE;
    player.grounded = false;
    // play sfx
    document.getElementById('sfx_jump').play();
  }

  function slide() {
    // implement slide behavior (shortened height)
    player.sliding = true;
    setTimeout(()=> player.sliding=false, 800);
  }

  function changeLane(dir) {
    player.lane = Math.min(2, Math.max(0, player.lane + dir));
    // animate y toward LANE_Y[player.lane]
  }

  // main loop
  function loop(t) {
    if (state !== 'playing') return;
    const dt = Math.min(0.033, (t - lastTime) / 1000);
    lastTime = t;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function update(dt) {
    // basic physics
    if (!player.grounded) {
      player.vy += GRAVITY * dt;
      player.y += player.vy * dt;
      if (player.y >= LANE_Y[player.lane]) {
        player.y = LANE_Y[player.lane];
        player.vy = 0;
        player.grounded = true;
      }
    } else {
      // snap to lane Y
      player.y = LANE_Y[player.lane];
    }

    // distance scoring (based on base speed)
    distance += BASE_SPEED * dt * 0.1;
    scoreEl.textContent = 'Score: ' + Math.floor(distance);
  }

  function render() {
    // clear
    ctx.clearRect(0,0,CANVAS.width, CANVAS.height);

    // TODO: draw parallax background, ground, obstacles
    
    // draw player (placeholder)
    ctx.fillStyle = '#ff6bcb';
    ctx.fillRect(player.x, player.y - player.height, player.width, player.height);
    // draw HUD icons if needed
  }

  // Simple collision & obstacle management is left as an exercise
  // Load assets, implement object pooling, spawn logic, and powerups per the checklist.

})();
</script>
</body>
</html>
