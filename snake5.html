<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <title>Snake Master - Kitapi Games</title>
    <link rel="icon" href="data:," />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap');

      :root {
        --bg-game: #1C242E;
        --purple-btn: #7D31F5;
        --purple-btn-hover: #9042F8;
        --red-btn: #EB4D3D;
        --green-score: #15A850;
        --cyan-timer: #16B4DB;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        background: #1C242E;
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        width: 100vw;
        position: relative;
        background: #1C242E;
        overflow: hidden;
      }

      /* ===== TOP HEADER (Figma Matched) ===== */
      header {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px 14px 6px;
        background: #1C242E;
        flex-shrink: 0;
        z-index: 25;
        gap: 10px;
        width: 100%;
      }

      /* Green Score Capsule */
      .score-capsule {
        background: #15A850;
        border-radius: 14px;
        padding: 6px 14px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        box-shadow: 0 4px 12px rgba(21, 168, 80, 0.4);
        border: 1px solid rgba(255,255,255,0.15);
        min-width: 110px;
      }

      .score-capsule .score-main {
        font-size: 15px;
        font-weight: 900;
        color: #ffffff;
        letter-spacing: 0.5px;
        line-height: 1.1;
      }

      .score-capsule .score-sub {
        font-size: 8.5px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.85);
        letter-spacing: 0.5px;
        margin-top: 2px;
      }

      /* Purple Action Button (Pause) */
      .btn-purple {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        border: none;
        background: #7D31F5;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(125, 49, 245, 0.45);
        transition: transform 0.15s ease, background 0.15s ease;
        flex-shrink: 0;
      }

      .btn-purple:active {
        transform: scale(0.92);
        background: #9042F8;
      }

      /* Orange/Red Action Button (Restart) */
      .btn-red {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        border: none;
        background: #EB4D3D;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(235, 77, 61, 0.45);
        transition: transform 0.15s ease;
        flex-shrink: 0;
      }

      .btn-red:active {
        transform: scale(0.92);
      }

      /* Cyan Timer Capsule */
      .timer-capsule {
        background: #16B4DB;
        border-radius: 14px;
        padding: 10px 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 12px rgba(22, 180, 219, 0.4);
        border: 1px solid rgba(255,255,255,0.15);
        min-width: 80px;
      }

      .timer-capsule .timer-val {
        font-size: 15px;
        font-weight: 900;
        color: #ffffff;
        letter-spacing: 0.5px;
      }

      /* ===== GAME AREA WITH CARD BACKGROUND ===== */
      #gameWrap {
        flex: 1;
        width: 100%;
        min-height: 0;
        position: relative;
        padding: 4px 12px 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1C242E;
      }

      /* Rounded Background Card for Game Boundary (Figma Exact) */
      #gameCard {
        width: 100%;
        height: 100%;
        max-width: 500px;
        position: relative;
        border-radius: 20px;
        background: linear-gradient(180.04deg, #364556 0.03%, #2E3F50 99.97%);
        box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Info Button placed in top right of Game Card */
      #infoBtn {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1.5px solid rgba(255, 255, 255, 0.4);
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 22;
        transition: transform 0.15s ease, background 0.15s ease;
      }

      #infoBtn:active {
        transform: scale(0.92);
        background: rgba(0, 0, 0, 0.7);
      }

      #canvasHolder {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      .performance-indicator {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(0,0,0,0.4);
        backdrop-filter: blur(6px);
        padding: 3px 6px;
        border-radius: 6px;
        font-size: 9px;
        color: #4ade80;
        z-index: 20;
        font-family: monospace;
      }

      .game-over-overlay {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.45);
        display: none;
        z-index: 35;
        backdrop-filter: blur(3px);
      }

      .game-over-overlay.show {
        display: block;
      }

      /* Touch D-Pad Controls */
      .controls {
        position: absolute;
        left: 12px;
        bottom: 12px;
        user-select: none;
        z-index: 20;
        opacity: 0.92;
      }

      .dpad {
        display: grid;
        grid-template-columns: repeat(3, 44px);
        grid-template-rows: repeat(3, 44px);
        gap: 3px;
        filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
      }

      .dpad button {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.15);
        background: rgba(26, 34, 52, 0.85);
        backdrop-filter: blur(12px);
        color: #fff;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.15s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .dpad button:active {
        transform: scale(0.9);
        background: rgba(125, 49, 245, 0.85);
      }

      .dpad button.hidden {
        visibility: hidden;
      }

      .speed-controls {
        position: absolute;
        right: 12px;
        bottom: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        z-index: 20;
        opacity: 0.92;
      }

      .speed-btn {
        padding: 8px 12px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.15);
        background: rgba(26, 34, 52, 0.85);
        backdrop-filter: blur(12px);
        color: #fff;
        font-weight: 700;
        font-size: 11px;
        cursor: pointer;
        transition: all 0.15s ease;
        font-family: 'Outfit', sans-serif;
      }

      .speed-btn:active {
        transform: scale(0.95);
        background: rgba(125, 49, 245, 0.85);
      }

      /* ===== MODAL BACKDROP ===== */
      .modal-backdrop {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 40;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(4px);
        display: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .modal-backdrop.show {
        display: block;
        opacity: 1;
      }

      /* ===== START GAME MODAL (Pure White Card Inset Figma) ===== */
      #startGame {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 50;
        background: #ffffff;
        border-radius: 22px;
        width: min(320px, 88vw);
        padding: 12px;
        display: none;
        box-shadow: 0 20px 60px rgba(0,0,0,0.65);
      }

      #startGame.show {
        display: block;
        animation: modalPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      @keyframes modalPop {
        from { opacity: 0; transform: translate(-50%, -50%) scale(0.85); }
        to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      }

      .start-video-wrap {
        width: 100%;
        border-radius: 16px;
        overflow: hidden;
        background: #000;
        position: relative;
        aspect-ratio: 3.2 / 4;
      }

      .start-video-wrap video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .start-footer {
        padding-top: 12px;
        text-align: center;
      }

      #startBtn {
        width: 100%;
        padding: 15px;
        border-radius: 14px;
        border: none;
        background: #7D31F5;
        color: #ffffff !important;
        font-size: 16px;
        font-weight: 800;
        font-family: 'Outfit', sans-serif;
        cursor: pointer;
        letter-spacing: 0.3px;
        box-shadow: 0 6px 20px rgba(125, 49, 245, 0.45);
        transition: transform 0.15s ease, background 0.15s ease;
        display: block;
      }

      #startBtn:active {
        transform: scale(0.97);
        background: #9042F8;
      }

      /* ===== GAME OVER MODAL ===== */
      #gameOver {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 50;
        background: #ffffff;
        border-radius: 20px;
        width: min(320px, 88vw);
        padding: 14px 14px 16px;
        display: none;
        box-shadow: 0 20px 60px rgba(0,0,0,0.65);
      }

      #gameOver.show {
        display: block;
        animation: modalPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .gameover-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-bottom: 10px;
      }

      .go-title {
        font-size: 16px;
        font-weight: 800;
        color: #1a1c24;
        line-height: 1.25;
        flex: 1;
      }

      .gameover-close {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: none;
        background: #f1f2f6;
        color: #555;
        font-size: 13px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Outfit', sans-serif;
        flex-shrink: 0;
      }

      .gameover-image {
        width: 100%;
        border-radius: 14px;
        aspect-ratio: 4 / 3;
        overflow: hidden;
        background: #1a2236;
      }

      .gameover-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .gameover-buttons {
        display: flex;
        gap: 10px;
        padding-top: 14px;
      }

      .gameover-buttons button {
        flex: 1;
        padding: 13px;
        border-radius: 12px;
        border: none;
        font-size: 15px;
        font-weight: 700;
        font-family: 'Outfit', sans-serif;
        cursor: pointer;
        transition: transform 0.15s ease;
      }

      #goMenu {
        background: #ebeef2;
        color: #333948;
      }

      #goRestart {
        background: #7D31F5;
        color: #ffffff;
        box-shadow: 0 4px 16px rgba(125, 49, 245, 0.4);
      }

      #goRestart:active, #goMenu:active {
        transform: scale(0.97);
      }

      /* ===== SWIPE GESTURES MODAL (Pure White Figma Card) ===== */
      #dirBackdrop {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 55;
        background: rgba(0,0,0,0.55);
        backdrop-filter: blur(4px);
        display: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      #dirBackdrop.show {
        display: block;
        opacity: 1;
      }

      #directionsSheet {
        position: fixed;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%) translateY(100%);
        z-index: 60;
        background: #ffffff;
        border-radius: 24px 24px 0 0;
        width: min(400px, 100vw);
        max-height: 85vh;
        overflow-y: auto;
        padding: 18px 16px 20px;
        padding-bottom: env(safe-area-inset-bottom, 24px);
        box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
        transition: transform 0.35s cubic-bezier(0.32, 1, 0.23, 1);
      }

      #directionsSheet.open {
        transform: translateX(-50%) translateY(0);
      }

      .gestures-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 14px;
      }

      .gestures-title {
        font-size: 18px;
        font-weight: 800;
        color: #111827;
        letter-spacing: -0.2px;
      }

      .gestures-close {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: none;
        background: #737882;
        color: #ffffff;
        font-size: 13px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Outfit', sans-serif;
        transition: transform 0.15s ease, background 0.15s ease;
      }

      .gestures-close:active {
        transform: scale(0.92);
        background: #525866;
      }

      .gestures-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .gesture-card {
        background: #364556;
        border-radius: 14px;
        padding: 10px 8px 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 135px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
      }

      .gesture-top {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        margin-bottom: 4px;
      }

      .gesture-label {
        font-size: 12px;
        font-weight: 700;
        color: #ffffff;
        white-space: nowrap;
      }

      .gesture-icon {
        width: 18px;
        height: 18px;
        object-fit: contain;
        flex-shrink: 0;
      }

      .gesture-img-wrap {
        flex: 1;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 85px;
        overflow: hidden;
      }

      .snake-img {
        max-width: 92%;
        max-height: 85px;
        object-fit: contain;
        display: block;
        filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
      }

      .snake-down {
        transform: rotate(-90deg);
        max-height: 85px;
      }

      /* ===== RESPONSIVE STYLES ===== */
      @media (max-width: 420px) {
        header { padding: 8px 8px 4px; gap: 6px; }
        .score-capsule { padding: 5px 10px; min-width: 95px; }
        .score-capsule .score-main { font-size: 13px; }
        .score-capsule .score-sub { font-size: 7.5px; }
        .btn-purple, .btn-red { width: 38px; height: 38px; border-radius: 10px; }
        .timer-capsule { padding: 8px 10px; min-width: 70px; }
        .timer-capsule .timer-val { font-size: 13px; }
        #gameWrap { padding: 2px 8px 8px; }
        .dpad { grid-template-columns: repeat(3,40px); grid-template-rows: repeat(3,40px); gap: 2px; }
        .dpad button { width: 40px; height: 40px; font-size: 15px; border-radius: 10px; }
        .controls { left: 8px; bottom: 8px; }
        .speed-controls { right: 8px; bottom: 8px; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- HEADER (Score, Pause, Restart, Timer) -->
      <header>
        <div class="score-capsule">
          <div class="score-main">SCORE : <span id="score">0</span></div>
          <div class="score-sub">BEST SCORE : <span id="highscore">0</span></div>
        </div>

        <button id="pauseBtn" class="btn-purple" aria-label="Pause Game">
          <svg width="14" height="18" viewBox="0 0 16 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M13.3333 19.3333C12.6 19.3333 11.9722 19.0722 11.45 18.55C10.9278 18.0278 10.6667 17.4 10.6667 16.6667V3.33333C10.6667 2.6 10.9278 1.97222 11.45 1.45C11.9722 0.927779 12.6 0.666668 13.3333 0.666668C14.0667 0.666668 14.6944 0.927779 15.2167 1.45C15.7389 1.97222 16 2.6 16 3.33333V16.6667C16 17.4 15.7389 18.0278 15.2167 18.55C14.6944 19.0722 14.0667 19.3333 13.3333 19.3333ZM2.66667 19.3333C1.93333 19.3333 1.30556 19.0722 0.783333 18.55C0.261111 18.0278 0 17.4 0 16.6667V3.33333C0 2.6 0.261111 1.97222 0.783333 1.45C1.30556 0.927779 1.93333 0.666668 2.66667 0.666668C3.4 0.666668 4.02778 0.927779 4.55 1.45C5.07222 1.97222 5.33333 2.6 5.33333 3.33333V16.6667C5.33333 17.4 5.07222 18.0278 4.55 18.55C4.02778 19.0722 3.4 19.3333 2.66667 19.3333Z" fill="white"/>
          </svg>
        </button>

        <button id="restartBtn" class="btn-red" aria-label="Restart Game">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0020 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 004 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z" fill="white"/>
          </svg>
        </button>

        <div class="timer-capsule">
          <div id="timer" class="timer-val">00:00</div>
        </div>
      </header>

      <!-- GAME VIEWPORT WITH ROUNDED CARD -->
      <div id="gameWrap">
        <div id="gameCard">
          <!-- Info Button at top-right of Game Card -->
          <button id="infoBtn" aria-label="Game Info">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M10 15C10.2833 15 10.5208 14.9042 10.7125 14.7125C10.9042 14.5208 11 14.2833 11 14V10C11 9.71667 10.9042 9.47917 10.7125 9.2875C10.5208 9.09583 10.2833 9 10 9C9.71667 9 9.47917 9.09583 9.2875 9.2875C9.09583 9.47917 9 9.71667 9 10V14C9 14.2833 9.09583 14.5208 9.2875 14.7125C9.47917 14.9042 9.71667 15 10 15ZM10 7C10.2833 7 10.5208 6.90417 10.7125 6.7125C10.9042 6.52083 11 6.28333 11 6C11 5.71667 10.9042 5.47917 10.7125 5.2875C10.5208 5.09583 10.2833 5 10 5C9.71667 5 9.47917 5.09583 9.2875 5.2875C9.09583 5.47917 9 5.71667 9 6C9 6.28333 9.09583 6.52083 9.2875 6.7125C9.47917 6.90417 9.71667 7 10 7ZM10 20C8.61667 20 7.31667 19.7375 6.1 19.2125C4.88333 18.6875 3.825 17.975 2.925 17.075C2.025 16.175 1.3125 15.1167 0.7875 13.9C0.2625 12.6833 0 11.3833 0 10C0 8.61667 0.2625 7.31667 0.7875 6.1C1.3125 4.88333 2.025 3.825 2.925 2.925C3.825 2.025 4.88333 1.3125 6.1 0.7875C7.31667 0.2625 8.61667 0 10 0C11.3833 0 12.6833 0.2625 13.9 0.7875C15.1167 1.3125 16.175 2.025 17.075 2.925C17.975 3.825 18.6875 4.88333 19.2125 6.1C19.7375 7.31667 20 8.61667 20 10C20 11.3833 19.7375 12.6833 19.2125 13.9C18.6875 15.1167 17.975 16.175 17.075 17.075C16.175 17.975 15.1167 18.6875 13.9 19.2125C12.6833 19.7375 11.3833 20 10 20Z" fill="white"/>
            </svg>
          </button>

          <div id="canvasHolder">
            <canvas id="glcanvas"></canvas>
            <div class="performance-indicator" id="fpsCounter">60 FPS</div>
            <div class="game-over-overlay" id="gameOverOverlay"></div>

            <!-- Touch D-Pad Controls -->
            <div class="controls">
              <div class="dpad" id="dpad">
                <button data-dir="nw" class="hidden" aria-hidden="true"></button>
                <button data-dir="up" aria-label="Move Up">&#9650;</button>
                <button data-dir="ne" class="hidden" aria-hidden="true"></button>
                <button data-dir="left" aria-label="Move Left">&#9664;</button>
                <button data-dir="center" class="hidden" aria-hidden="true"></button>
                <button data-dir="right" aria-label="Move Right">&#9654;</button>
                <button data-dir="sw" class="hidden" aria-hidden="true"></button>
                <button data-dir="down" aria-label="Move Down">&#9660;</button>
                <button data-dir="se" class="hidden" aria-hidden="true"></button>
              </div>
            </div>

            <!-- Speed Controls -->
            <div class="speed-controls">
              <button id="speedUp" class="speed-btn" aria-label="Increase Speed">&#9889;+</button>
              <button id="speedDown" class="speed-btn" aria-label="Decrease Speed">&#9889;&#8722;</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Backdrop -->
    <div class="modal-backdrop" id="modalBackdrop"></div>

    <!-- START GAME MODAL (Pure White Figma Card) -->
    <div id="startGame" class="show">
      <div class="start-video-wrap">
        <video
          id="introVideo"
          autoplay
          loop
          muted
          playsinline

    <!-- THREE.JS -->
    <script src="https://unpkg.com/three@0.156.0/build/three.min.js"></script>

    <script>
      (() => {
        // FPS Meter
        let fps = 60, frameCount = 0, lastFpsUpdate = 0;
        const fpsCounter = document.getElementById('fpsCounter');
        function updateFPS(t) {
          frameCount++;
          if (t - lastFpsUpdate >= 1000) {
            fps = Math.round((frameCount * 1000) / (t - lastFpsUpdate));
            fpsCounter.textContent = fps + ' FPS';
            frameCount = 0; lastFpsUpdate = t;
          }
        }

        // DOM elements
        const introVideo      = document.getElementById('introVideo');
        const startModal      = document.getElementById('startGame');
        const gameOverModal   = document.getElementById('gameOver');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const modalBackdrop   = document.getElementById('modalBackdrop');
        const scoreEl         = document.getElementById('score');
        const highScoreEl     = document.getElementById('highscore');
        const timerEl         = document.getElementById('timer');
        const dirSheet        = document.getElementById('directionsSheet');
        const dirBackdrop     = document.getElementById('dirBackdrop');
        const goTitle         = document.getElementById('goTitle');
        const goImage         = document.getElementById('goImage');

        // Directions modal handlers
        document.getElementById('infoBtn').addEventListener('click', () => {
          dirSheet.classList.add('open');
          dirBackdrop.classList.add('show');
        });
        function closeDirections() {
          dirSheet.classList.remove('open');
          dirBackdrop.classList.remove('show');
        }
        document.getElementById('sheetClose').addEventListener('click', closeDirections);
        dirBackdrop.addEventListener('click', closeDirections);

        // Start button handler
        document.getElementById('startBtn').addEventListener('click', () => {
          if (introVideo) { introVideo.pause(); introVideo.currentTime = 0; }
          startModal.classList.remove('show');
          modalBackdrop.classList.remove('show');
          restartGame();
        });

        // Close Game Over handler
        document.getElementById('goClose').addEventListener('click', () => {
          gameOverModal.classList.remove('show');
          gameOverOverlay.classList.remove('show');
          modalBackdrop.classList.remove('show');
          startModal.classList.add('show');
          modalBackdrop.classList.add('show');
          playing = false; gameStarted = false;
          if (introVideo) { introVideo.currentTime = 0; introVideo.play().catch(() => {}); }
        });

        // THREE.JS SCENE SETUP
        const canvas = document.getElementById('glcanvas');
        const renderer = new THREE.WebGLRenderer({
          canvas,
          antialias: window.devicePixelRatio <= 1,
          alpha: true,
          powerPreference: 'high-performance',
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setClearColor(0x000000, 0);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        camera.position.set(0, 160, 0);
        camera.lookAt(0, 0, 0);

        // LIGHTING
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
        dirLight.position.set(60, 130, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.setScalar(2048);
        dirLight.shadow.camera.left = -160;
        dirLight.shadow.camera.right = 160;
        dirLight.shadow.camera.bottom = -160;
        dirLight.shadow.camera.top = 160;
        dirLight.shadow.camera.far = 350;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        // Responsive Field Dimensions
        function getGameDimensions() {
          const portrait = window.innerWidth < window.innerHeight;
          const mobile   = window.innerWidth < 768;
          return mobile
            ? { width: portrait ? 136 : 180, height: portrait ? 210 : 150 }
            : { width: portrait ? 148 : 200, height: portrait ? 210 : 150 };
        }

        let gameDimensions = getGameDimensions();

        // Original Grass Texture Generator
        function generateGrassTex(w, h) {
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#25e610';
          ctx.fillRect(0, 0, w, h);
          for (let i = 0; i < 20000; i++) {
            const x = Math.random() * w, y = Math.random() * h, s = Math.random() * 4 + 1;
            const g = ctx.createRadialGradient(x, y, 0, x, y, s);
            const gi = Math.random() * 80 + 100;
            g.addColorStop(0, 'rgba(60,' + gi + ',60,' + (Math.random() * 0.6 + 0.2) + ')');
            g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(x, y, s, 0, Math.PI * 2);
            ctx.fill();
          }
          const tex = new THREE.CanvasTexture(c);
          tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
          return tex;
        }

        function createGround() {
          const tex = generateGrassTex(512, 512);
          tex.repeat.set(gameDimensions.width / 24, gameDimensions.height / 24);
          const mesh = new THREE.Mesh(
            new THREE.PlaneGeometry(gameDimensions.width, gameDimensions.height, 16, 16),
            new THREE.MeshLambertMaterial({ map: tex })
          );
          mesh.rotation.x = -Math.PI / 2;
          mesh.receiveShadow = true;
          scene.add(mesh);
          return mesh;
        }

        // Wooden Palisade Fence (Figma Style)
        function createFence(w, h) {
          const g = new THREE.Group();
          const fMat = new THREE.MeshStandardMaterial({ color: 0x654321, roughness: 0.8, metalness: 0.1 });
          const pMat = new THREE.MeshStandardMaterial({ color: 0x8b4513, roughness: 0.7, metalness: 0.2 });

          const hw = w / 2, hh = h / 2;
          const railH = new THREE.BoxGeometry(w + 2, 3, 2.8);
          const railV = new THREE.BoxGeometry(2.8, 3, h + 2);
          const postGeo = new THREE.BoxGeometry(3.5, 17, 3.5);

          // Horizontal rails
          [[0, 9.5, -hh], [0, 4.8, -hh], [0, 9.5, hh], [0, 4.8, hh]].forEach(p => {
            const m = new THREE.Mesh(railH, fMat);
            m.position.set(...p);
            m.castShadow = true;
            g.add(m);
          });

          // Vertical rails
          [[-hw, 9.5, 0], [-hw, 4.8, 0], [hw, 9.5, 0], [hw, 4.8, 0]].forEach(p => {
            const m = new THREE.Mesh(railV, fMat);
            m.position.set(...p);
            m.castShadow = true;
            g.add(m);
          });

          // Perimeter fence posts
          const stepX = 22, stepZ = 22;
          for (let x = -hw; x <= hw; x += stepX) {
            for (const z of [-hh, hh]) {
              const m = new THREE.Mesh(postGeo, pMat);
              m.position.set(x, 8.5, z);
              m.castShadow = true;
              g.add(m);
            }
          }
          for (let z = -hh; z <= hh; z += stepZ) {
            for (const x of [-hw, hw]) {
              const m = new THREE.Mesh(postGeo, pMat);
              m.position.set(x, 8.5, z);
              m.castShadow = true;
              g.add(m);
            }
          }

          scene.add(g);
          return g;
        }

        let ground = createGround();
        let fence  = createFence(gameDimensions.width, gameDimensions.height);

        let BOUNDS = {
          minX: -gameDimensions.width / 2 + 7,
          maxX: gameDimensions.width / 2 - 7,
          minZ: -gameDimensions.height / 2 + 7,
          maxZ: gameDimensions.height / 2 - 7,
        };

        // GAME STATE
        let snake = [], direction = new THREE.Vector2(1, 0), nextDirection = new THREE.Vector2(1, 0);
        let speed = 40, growthQueue = 0, snakeMeshes = [], eyeMeshes = [];
        let playing = false, gameStarted = false, score = 0;
        let highScore = parseInt(localStorage.getItem('snake3d_high') || '0');
        let lastTime = 0, insects = [], collisionCheckEnabledTime = 0;
        const COLLISION_DELAY_MS = 600;
        let gameStartTime = 0, elapsedSeconds = 0;

        highScoreEl.textContent = highScore;

        function updateTimer() {
          if (!playing || !gameStarted) return;
          elapsedSeconds = Math.floor((performance.now() - gameStartTime) / 1000);
          const m = Math.floor(elapsedSeconds / 60), s = elapsedSeconds % 60;
          timerEl.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
        }

        // SNAKE CREATION
        function initSnake() {
          snakeMeshes.forEach(m => scene.remove(m));
          eyeMeshes.forEach(m => scene.remove(m));
          snakeMeshes = []; eyeMeshes = []; snake = [];
          for (let i = 0; i < 5; i++) snake.push(new THREE.Vector2(-40 - i * 6, 0));
          direction.set(1, 0);
          nextDirection.set(1, 0);
          growthQueue = 0;
          snake.forEach((_, i) => createSegmentMesh(i));
        }

        function createSegmentMesh(index) {
          const isHead = index === 0;
          const r = isHead ? 4.2 : Math.max(2.6, 3.9 - index * 0.02);
          const hue = isHead ? 0.32 : Math.max(0.26, 0.31 - index * 0.008);
          const color = new THREE.Color().setHSL(hue, 0.85, 0.52);
          
          const mesh = new THREE.Mesh(
            new THREE.SphereGeometry(r, 16, 12),
            new THREE.MeshStandardMaterial({
              color,
              roughness: 0.25,
              metalness: 0.1,
              emissive: color,
              emissiveIntensity: isHead ? 0.12 : 0.04,
            })
          );
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          scene.add(mesh);
          snakeMeshes[index] = mesh;

          if (isHead) {
            const hg = new THREE.Group();
            const eGeo = new THREE.SphereGeometry(0.85, 8, 6);
            const eMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.8 });
            const sGeo = new THREE.SphereGeometry(0.32, 6, 4);
            const sMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.6 });

            const le = new THREE.Mesh(eGeo, eMat); le.position.set(3.0, 1.3, 1.5);
            const re = new THREE.Mesh(eGeo, eMat); re.position.set(3.0, 1.3, -1.5);
            const ls = new THREE.Mesh(sGeo, sMat); ls.position.set(3.2, 1.5, 1.7);
            const rs = new THREE.Mesh(sGeo, sMat); rs.position.set(3.2, 1.5, -1.3);

            hg.add(le, re, ls, rs);
            mesh.add(hg);
            eyeMeshes[0] = hg;
          }
        }

        function updateSnakeMeshes() {
          while (snakeMeshes.length < snake.length) createSegmentMesh(snakeMeshes.length);
          while (snakeMeshes.length > snake.length) {
            scene.remove(snakeMeshes.pop());
            if (eyeMeshes.length > snakeMeshes.length) eyeMeshes.pop();
          }
          const t = performance.now() * 0.001;
          snake.forEach((seg, i) => {
            const m = snakeMeshes[i]; if (!m) return;
            m.position.set(seg.x, 4 + Math.sin(t * 2.5 + i * 0.3) * 0.4, seg.y);
            if (i === 0) {
              m.rotation.y = -Math.atan2(direction.y, direction.x);
              m.rotation.z = Math.sin(t * 3) * 0.08;
            } else {
              const p = snake[i - 1];
              m.rotation.y = -Math.atan2(p.y - seg.y, p.x - seg.x);
            }
          });
        }

        // 3D COLORFUL INSECTS (Red, Yellow, Blue, Green)
        const INSECT_COLORS = [
          { name: 'red', shell: 0xff3b30, dark: 0x111111 },
          { name: 'yellow', shell: 0xffcc00, dark: 0x222222 },
          { name: 'blue', shell: 0x38bdf8, dark: 0x0f172a },
          { name: 'green', shell: 0x22c55e, dark: 0x064e3b },
        ];

        function create3DInsect() {
          const group = new THREE.Group();
          const colInfo = INSECT_COLORS[Math.floor(Math.random() * INSECT_COLORS.length)];

          // Dome Shell
          const shellGeo = new THREE.SphereGeometry(3.2, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.55);
          const shellMat = new THREE.MeshStandardMaterial({
            color: colInfo.shell,
            roughness: 0.2,
            metalness: 0.15,
            emissive: colInfo.shell,
            emissiveIntensity: 0.15,
          });
          const shell = new THREE.Mesh(shellGeo, shellMat);
          shell.position.y = 1.2;
          shell.castShadow = true;
          group.add(shell);

          // Black spots on shell
          const spotGeo = new THREE.SphereGeometry(0.65, 8, 6);
          const spotMat = new THREE.MeshStandardMaterial({ color: colInfo.dark, roughness: 0.3 });
          [
            [1.6, 2.8, 1.2],
            [-1.6, 2.8, 1.2],
            [1.8, 2.2, -1.2],
            [-1.8, 2.2, -1.2],
            [0, 3.4, 0],
          ].forEach(pos => {
            const spot = new THREE.Mesh(spotGeo, spotMat);
            spot.position.set(...pos);
            group.add(spot);
          });

          // Head
          const headGeo = new THREE.SphereGeometry(1.6, 10, 8);
          const headMat = new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.3 });
          const head = new THREE.Mesh(headGeo, headMat);
          head.position.set(0, 1.6, 2.8);
          head.castShadow = true;
          group.add(head);

          // Eyes
          const eyeGeo = new THREE.SphereGeometry(0.4, 6, 6);
          const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.8 });
          const le = new THREE.Mesh(eyeGeo, eyeMat); le.position.set(0.7, 2.2, 3.8);
          const re = new THREE.Mesh(eyeGeo, eyeMat); re.position.set(-0.7, 2.2, 3.8);
          group.add(le, re);

          // Ground shadow disc
          const shadowGeo = new THREE.CircleGeometry(3.6, 16);
          const shadowMat = new THREE.MeshBasicMaterial({
            color: 0x000000,
            transparent: true,
            opacity: 0.35,
            depthWrite: false,
          });
          const shadowDisc = new THREE.Mesh(shadowGeo, shadowMat);
          shadowDisc.rotation.x = -Math.PI / 2;
          shadowDisc.position.y = 0.05;
          group.add(shadowDisc);

          group.userData = {
            bobPhase: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.03,
          };

          return group;
        }

        function spawnInsect() {
          const mesh = create3DInsect();
          const margin = 12;
          mesh.position.set(
            THREE.MathUtils.randFloatSpread(BOUNDS.maxX - BOUNDS.minX - margin * 2),
            0.5,
            THREE.MathUtils.randFloatSpread(BOUNDS.maxZ - BOUNDS.minZ - margin * 2)
          );
          mesh.rotation.y = Math.random() * Math.PI * 2;
          scene.add(mesh);
          insects.push(mesh);
        }

        function updateInsects() {
          const t = performance.now() * 0.001;
          for (let i = insects.length - 1; i >= 0; i--) {
            const ins = insects[i];
            ins.position.y = 0.5 + Math.sin(t * 3 + ins.userData.bobPhase) * 0.6;
            ins.rotation.y += ins.userData.rotSpeed;

            if (snake.length > 0) {
              const h = snake[0];
              const d = Math.sqrt(Math.pow(h.x - ins.position.x, 2) + Math.pow(h.y - ins.position.z, 2));
              if (d < 7.5) {
                scene.remove(ins);
                insects.splice(i, 1);
                growthQueue += 4;
                score += 10;
                scoreEl.textContent = score;
                if (score > highScore) {
                  highScore = score;
                  highScoreEl.textContent = highScore;
                  localStorage.setItem('snake3d_high', String(highScore));
                }
                spawnInsect();
                if (navigator.vibrate) navigator.vibrate(40);
              }
            }
          }
        }

        // GAME STEP
        function gameStep(dt) {
          if (!playing || dt <= 0) return;
          updateTimer();
          if (nextDirection.length() > 0 && direction.dot(nextDirection) > -0.8) {
            direction.copy(nextDirection);
          }
          const h = snake[0].clone();
          h.x += direction.x * speed * dt;
          h.y += direction.y * speed * dt;
          snake.unshift(h);
          growthQueue > 0 ? growthQueue-- : snake.pop();

          updateSnakeMeshes();
          updateInsects();

          if (performance.now() >= collisionCheckEnabledTime) {
            checkCollisions();
          }
        }

        // COLLISION CHECK
        function checkCollisions() {
          if (!snake.length) return;
          const h = snake[0];
          
          if (h.x < BOUNDS.minX || h.x > BOUNDS.maxX || h.y < BOUNDS.minZ || h.y > BOUNDS.maxZ) {
            endGame('wall');
            return;
          }

          const minIndex = Math.max(16, Math.floor(snake.length * 0.25));
          for (let i = minIndex; i < snake.length; i++) {
            const d = Math.sqrt(Math.pow(h.x - snake[i].x, 2) + Math.pow(h.y - snake[i].y, 2));
            if (d < 5.2) {
              endGame('self');
              return;
            }
          }
        }

        // END GAME
        function endGame(reason) {
          playing = false;
          if (reason === 'wall') {
            goTitle.textContent = 'Ahh! You hit the wall';
            goImage.src = 'https://res.cloudinary.com/dtct6qef2/image/upload/v1761288635/hit-the-fence_nhoxcb.png';
            goImage.alt = 'Hit the fence';
          } else {
            goTitle.textContent = 'Oops! You ran into yourself';
            goImage.src = 'https://res.cloudinary.com/dtct6qef2/image/upload/v1761288637/ran-into-yourself_ht1kp4.png';
            goImage.alt = 'Ran into yourself';
          }

          modalBackdrop.classList.add('show');
          gameOverOverlay.classList.add('show');
          gameOverModal.classList.add('show');
          if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
        }

        // RESTART GAME
        function restartGame() {
          insects.forEach(m => scene.remove(m));
          insects = [];
          score = 0;
          scoreEl.textContent = '0';
          gameStartTime = performance.now();
          elapsedSeconds = 0;
          timerEl.textContent = '00:00';

          gameOverModal.classList.remove('show');
          gameOverOverlay.classList.remove('show');
          startModal.classList.remove('show');
          modalBackdrop.classList.remove('show');

          initSnake();

          const insectCount = Math.max(7, Math.floor(gameDimensions.width * gameDimensions.height / 2800));
          for (let i = 0; i < insectCount; i++) spawnInsect();

          playing = true;
          gameStarted = true;
          lastTime = performance.now();
          collisionCheckEnabledTime = performance.now() + COLLISION_DELAY_MS;
        }

        function setDir(x, y) {
          if (playing) nextDirection.copy(new THREE.Vector2(x, y).normalize());
        }

        // KEYBOARD CONTROLS
        document.addEventListener('keydown', e => {
          if (!gameStarted && (e.code === 'Space' || e.code === 'Enter')) {
            startModal.classList.remove('show');
            modalBackdrop.classList.remove('show');
            restartGame();
            return;
          }
          if (e.code === 'KeyR') { restartGame(); return; }
          if ((e.code === 'KeyP' || e.code === 'Space') && gameStarted) { togglePause(); return; }

          switch (e.code) {
            case 'ArrowUp': case 'KeyW': setDir(0, -1); e.preventDefault(); break;
            case 'ArrowDown': case 'KeyS': setDir(0, 1); e.preventDefault(); break;
            case 'ArrowLeft': case 'KeyA': setDir(-1, 0); e.preventDefault(); break;
            case 'ArrowRight': case 'KeyD': setDir(1, 0); e.preventDefault(); break;
          }
        });

        // TOUCH DPAD
        let touchHandled = false;
        function handleDir(dir) {
          if (touchHandled) return;
          touchHandled = true;
          setTimeout(() => touchHandled = false, 120);

          switch (dir) {
            case 'up': setDir(0, -1); break;
            case 'down': setDir(0, 1); break;
            case 'left': setDir(-1, 0); break;
            case 'right': setDir(1, 0); break;
          }
          if (navigator.vibrate) navigator.vibrate(20);
        }

        document.querySelectorAll('#dpad button').forEach(btn => {
          const dir = btn.getAttribute('data-dir');
          btn.addEventListener('touchstart', e => { e.preventDefault(); handleDir(dir); });
          btn.addEventListener('click', e => { e.preventDefault(); handleDir(dir); });
        });

        // SWIPE GESTURES
        let touchStart = null;
        canvas.addEventListener('touchstart', e => {
          touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
        }, { passive: true });

        canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

        canvas.addEventListener('touchend', e => {
          if (!touchStart || touchHandled) return;
          const dx = e.changedTouches[0].clientX - touchStart.x;
          const dy = e.changedTouches[0].clientY - touchStart.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist > 35 && Date.now() - touchStart.t < 400) {
            if (Math.abs(dx) > Math.abs(dy)) {
              setDir(dx > 0 ? 1 : -1, 0);
            } else {
              setDir(0, dy > 0 ? 1 : -1);
            }
            if (navigator.vibrate) navigator.vibrate(25);
          }
          touchStart = null;
        }, { passive: true });

        // SPEED CONTROLS
        document.getElementById('speedUp').addEventListener('click', () => {
          speed = Math.min(speed + 10, 100);
          if (navigator.vibrate) navigator.vibrate(20);
        });
        document.getElementById('speedDown').addEventListener('click', () => {
          speed = Math.max(speed - 10, 20);
          if (navigator.vibrate) navigator.vibrate(20);
        });

        // PAUSE & RESUME
        const PAUSE_SVG = `<svg width="14" height="18" viewBox="0 0 16 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13.3333 19.3333C12.6 19.3333 11.9722 19.0722 11.45 18.55C10.9278 18.0278 10.6667 17.4 10.6667 16.6667V3.33333C10.6667 2.6 10.9278 1.97222 11.45 1.45C11.9722 0.927779 12.6 0.666668 13.3333 0.666668C14.0667 0.666668 14.6944 0.927779 15.2167 1.45C15.7389 1.97222 16 2.6 16 3.33333V16.6667C16 17.4 15.7389 18.0278 15.2167 18.55C14.6944 19.0722 14.0667 19.3333 13.3333 19.3333ZM2.66667 19.3333C1.93333 19.3333 1.30556 19.0722 0.783333 18.55C0.261111 18.0278 0 17.4 0 16.6667V3.33333C0 2.6 0.261111 1.97222 0.783333 1.45C1.30556 0.927779 1.93333 0.666668 2.66667 0.666668C3.4 0.666668 4.02778 0.927779 4.55 1.45C5.07222 1.97222 5.33333 2.6 5.33333 3.33333V16.6667C5.33333 17.4 5.07222 18.0278 4.55 18.55C4.02778 19.0722 3.4 19.3333 2.66667 19.3333Z" fill="white"/></svg>`;
        const PLAY_SVG = `<svg width="16" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 5v14l11-7z" fill="white"/></svg>`;

        function togglePause() {
          if (!gameStarted) return;
          playing = !playing;
          const pb = document.getElementById('pauseBtn');
          if (playing) {
            lastTime = performance.now();
            gameStartTime = performance.now() - elapsedSeconds * 1000;
            pb.innerHTML = PAUSE_SVG;
          } else {
            pb.innerHTML = PLAY_SVG;
          }
        }

        document.getElementById('goRestart').addEventListener('click', restartGame);
        document.getElementById('goMenu').addEventListener('click', () => {
          gameOverModal.classList.remove('show');
          gameOverOverlay.classList.remove('show');
          modalBackdrop.classList.remove('show');
          startModal.classList.add('show');
          modalBackdrop.classList.add('show');
          playing = false; gameStarted = false;
          if (introVideo) { introVideo.currentTime = 0; introVideo.play().catch(() => {}); }
        });

        document.getElementById('restartBtn').addEventListener('click', restartGame);
        document.getElementById('pauseBtn').addEventListener('click', togglePause);

        // RESIZE & CAMERA ALIGNMENT
        function onResize() {
          const r = canvas.parentElement.getBoundingClientRect();
          renderer.setSize(r.width, r.height);
          camera.aspect = r.width / r.height;

          const nd = getGameDimensions();
          if (nd.width !== gameDimensions.width || nd.height !== gameDimensions.height) {
            gameDimensions = nd;
            BOUNDS = {
              minX: -nd.width / 2 + 7,
              maxX: nd.width / 2 - 7,
              minZ: -nd.height / 2 + 7,
              maxZ: nd.height / 2 - 7,
            };
            scene.remove(ground);
            scene.remove(fence);
            ground = createGround();
            fence = createFence(nd.width, nd.height);
          }

          const gw = gameDimensions.width + 18, gh = gameDimensions.height + 18;
          const fov = camera.fov * Math.PI / 180, tf = Math.tan(fov / 2);
          camera.position.y = Math.max(gw / 2 / (camera.aspect * tf), gh / 2 / tf) * 1.08;
          camera.updateProjectionMatrix();
        }

        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', () => setTimeout(onResize, 100));

        // MAIN ANIMATION LOOP
        function animate(t) {
          requestAnimationFrame(animate);
          updateFPS(t);
          const dt = Math.min((t - lastTime) / 1000, 0.02);
          lastTime = t;
          gameStep(dt);
          renderer.render(scene, camera);
        }

        modalBackdrop.classList.add('show');
        onResize();
        animate(0);

        canvas.addEventListener('contextmenu', e => e.preventDefault());
        document.body.addEventListener('touchmove', e => {
          if (e.target === canvas || e.target.closest('.controls') || e.target.closest('.speed-controls')) {
            e.preventDefault();
          }
        }, { passive: false });

        document.addEventListener('visibilitychange', () => {
          if (document.hidden && playing && gameStarted) togglePause();
        });
      })();
    </script>
  </body>
</html>
